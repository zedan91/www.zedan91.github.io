<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Likes | AZOBSS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#081426;color:white;font-family:Arial,Helvetica,sans-serif;padding-top:58px;}
    .market-sticky-bar{position:fixed;top:0;left:0;right:0;z-index:3200;background:#000;border-bottom:1px solid rgba(218,165,32,.45);box-shadow:0 10px 24px rgba(0,0,0,.28)}
    .market-bar-inner{width:100%;margin:0;padding:0 10px;box-sizing:border-box}
    .market-main-row{min-height:54px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:visible}
    .market-brand{display:flex;align-items:center;justify-content:center;width:154px;min-width:154px;height:38px;border:1px solid rgba(148,163,184,.35);border-radius:999px;background:#0e1729;overflow:hidden;text-decoration:none}
    .market-brand img{width:100%;height:100%;object-fit:contain;display:block}
    .market-nav{display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;scrollbar-width:none}
    .market-nav::-webkit-scrollbar{display:none}
    .market-nav a{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:32px;padding:0 12px;border:1px solid rgba(148,163,184,.28);border-radius:999px;background:#0e1729;color:#e5e7eb;text-decoration:none;font-size:13px;font-weight:800;line-height:1;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    .market-nav a:hover{color:#14b8a6}

    .nav-chat-pill{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:52px;min-width:52px;height:34px;border:1px solid rgba(148,163,184,.35);border-radius:999px;background:#0e1729;color:#fff;text-decoration:none;box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
    .nav-chat-pill svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .nav-chat-pill:hover{color:#22c55e;border-color:rgba(34,197,94,.45)}
    .user-name:after{content:'';display:inline-block;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:8px;margin-bottom:3px;color:#fff;vertical-align:middle}
    .market-nav a.market-nav-active{background:#22c55e!important;border-color:#22c55e!important;color:#052e16!important;text-shadow:none!important;box-shadow:0 0 15px rgba(34,197,94,.34),inset 0 0 0 1px rgba(255,255,255,.12)!important}
    .nav-whatsapp-circle{display:block;width:31px;height:31px;border-radius:999px;background:linear-gradient(135deg,#22c55e,#15b56d);position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.12) inset}
    .nav-whatsapp-circle:after{content:'';position:absolute;left:9px;top:9px;width:12px;height:12px;border-radius:50%;background:#eafff3}
    .market-user-tools{display:none;align-items:center;gap:10px;margin-left:auto;color:#fff;overflow:visible;white-space:nowrap}
    .user-menu{display:flex;align-items:center;gap:8px;position:relative;cursor:pointer;z-index:100000}
    .user-avatar{width:30px;height:30px;border-radius:999px;border:1px solid #22d3ee;display:flex;align-items:center;justify-content:center;background:#081426;color:#dffcff;font-size:12px;font-weight:800}
    .user-name{font-size:14px;font-weight:800;color:#fff}
    .user-dropdown{display:none;position:absolute;top:calc(100% + 10px);right:0;width:220px;min-width:220px;max-width:calc(100vw - 16px);padding:8px;border-radius:14px;background:#08111f;border:1px solid rgba(148,163,184,.28);box-shadow:0 18px 50px rgba(0,0,0,.58);z-index:100001;color:#fff}
    .user-menu.is-open .user-dropdown{display:block}
    .user-dropdown-section{padding:7px 10px 4px;font-size:11px;font-weight:900;color:#a7b3c7;text-transform:none}
    .user-dropdown-item{display:flex;align-items:center;width:100%;min-height:38px;padding:9px 10px;border:0;background:transparent;color:#e5e7eb;text-decoration:none;font:inherit;font-size:13px;text-align:left;border-radius:10px;cursor:pointer}
    .user-dropdown-item:hover{background:rgba(255,255,255,.08)}
    .market-icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;border-radius:999px}
    .market-icon-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .market-icon-btn.is-likes-active svg{fill:#ff4d6d;stroke:#ff4d6d}
    .site-auth-actions{display:flex;align-items:center;gap:16px;margin-left:auto}
    .site-auth-btn{border:0;background:transparent;color:#fff;font-weight:900;font-size:14px;cursor:pointer;padding:6px 2px}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 18px;}
    .top{display:block;margin-bottom:18px;}
    h1{margin:0;font-size:34px;}
    .likes-controls{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;align-items:end;margin:18px 0 18px;}
    .likes-control label{display:block;margin:0 0 6px;font-size:13px;font-weight:900;color:#dbeafe;}
    .likes-control input,.likes-control select{width:100%;height:42px;border:1px solid rgba(148,163,184,.35);border-radius:12px;background:#0f172a;color:#fff;padding:0 14px;font-weight:700;outline:none;}
    .likes-control input:focus,.likes-control select:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.12);}
    .muted{color:#9fb0c9;margin:8px 0 18px;}
    .az-like-empty{border:1px solid rgba(148,163,184,.25);background:rgba(15,23,42,.72);border-radius:14px;padding:16px;color:#cbd5e1}
    @media(max-width:760px){
      body{padding-top:98px;}
      .market-bar-inner{padding:0 6px}
      .market-main-row{min-height:auto;padding-top:9px;gap:6px;flex-wrap:wrap}
      .market-brand{width:128px;min-width:128px;height:34px}
      .market-nav{order:3;width:100%;flex-basis:100%;gap:6px;overflow:hidden;padding-bottom:8px}
      .market-nav a{min-height:30px;padding:0 9px;font-size:11px}
      .nav-chat-pill{width:44px;min-width:44px;height:32px;padding:0}
      .nav-chat-pill svg{width:20px;height:20px}
      .site-auth-actions{margin-left:auto;margin-right:8px;gap:12px}
      .site-auth-btn{font-size:13px;white-space:nowrap}
      .market-user-tools{margin-left:auto;gap:8px}
      .user-name{font-size:13px}
      .user-dropdown{position:fixed;top:92px;right:8px;width:210px;min-width:210px;max-height:68vh;overflow-y:auto}
      .wrap{padding:22px 14px}
      h1{font-size:28px}
      .likes-controls{grid-template-columns:1fr;gap:10px;}
      .likes-control input,.likes-control select{height:40px;font-size:13px;}
    }
  </style>
</head>
<body>
  <header aria-label="AZOBSS navigation" class="market-sticky-bar">
    <div class="market-bar-inner">
      <div class="market-main-row">
        <a aria-label="AZOBSS" class="market-brand" href="/">
          <img alt="AZOBSS" src="/images/logo-azobss.jpg">
        </a>
        <nav aria-label="AZOBSS quick actions" class="market-nav">
          <a aria-label="Chat" class="nav-chat-pill" href="https://alvo.chat/6nZ2" rel="noopener" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" style="width:22px;height:22px;border-radius:50%;"></a>
          <a class="nav-pa-bm-link is-hidden" hidden href="/PA-BM/" id="paBmNavButton">PA / BM</a>
          <a href="/Software-Tools/">Software</a>
          <a href="/CAD-Tools-&amp;-Resources/">CAD Tools</a>
          <a href="/affiliate-shop/">Affiliate Shop</a>
          <a href="/lucky-draw/">Lucky Draw</a>
          <a href="/tools/">Mini Web Tools</a>
        </nav>
        <div class="site-auth-actions" id="siteAuthActions">
          <button class="site-auth-btn primary" data-auth-open="register" id="siteSignUpButton" type="button">Register</button>
          <button class="site-auth-btn" data-auth-open="login" id="siteSignInButton" type="button">Login</button>
        </div>
        <div class="market-user-tools" id="marketUserTools">
          <div aria-expanded="false" aria-haspopup="true" class="user-menu" id="userMenu" role="button" tabindex="0">
            <div class="user-avatar" id="userAvatar">AZ</div>
            <div class="user-name">Hello, <span id="signedInName"></span></div>
            <button class="user-upgrade-btn" hidden id="userUpgradeButton" type="button">Upgrade</button>
            <div aria-label="Account menu" class="user-dropdown" id="userDropdown" role="menu">
              <div class="user-dropdown-section">Buying</div>
              <a class="user-dropdown-item" href="/#purchases" role="menuitem">My purchases</a>
              <a class="user-dropdown-item" href="/likes/" role="menuitem">Likes</a>
              <div class="user-dropdown-section">Account</div>
              <button class="user-dropdown-item" id="profileSettingsButton" role="menuitem" type="button">Settings</button>
              <button class="user-dropdown-item" id="logoutButton" role="menuitem" type="button">Log out</button>
            </div>
          </div>
          <a aria-label="Likes" class="market-icon-btn is-likes-active" href="/likes/">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 4.6c-1.8-1.8-4.6-1.7-6.3.2L12 7.4 9.5 4.8C7.8 2.9 5 2.8 3.2 4.6c-1.9 1.9-1.9 5 0 6.9L12 20l8.8-8.5c1.9-1.9 1.9-5 0-6.9Z"></path></svg>
          </a>
          <a aria-label="Cart" class="market-icon-btn" href="/affiliate-shop/">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10.8l2-8H7"></path><path d="M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path><path d="M18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg>
          </a>
          <a aria-label="Notifications" class="market-icon-btn" href="/PA-BM/">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path><path d="M10 21h4"></path></svg>
          </a>
          <a aria-label="Chat" class="market-icon-btn" href="https://alvo.chat/6nZ2" rel="noopener" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" style="width:22px;height:22px;border-radius:50%;">
          </a>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="top">
      <div>
        <h1>❤️ Likes</h1>
        <p class="muted">Items you liked from Affiliate Shop, CAD Tools and Software Tools.</p>
      </div>
    </div>
    <div class="likes-controls">
      <div class="likes-control">
        <label for="likesSearchInput">Search likes</label>
        <input id="likesSearchInput" type="search" placeholder="Search liked items, category or page">
      </div>
      <div class="likes-control">
        <label for="likesSortSelect">Sort by</label>
        <select id="likesSortSelect">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">Name A-Z</option>
          <option value="za">Name Z-A</option>
          <option value="category">Category</option>
          <option value="software">Software</option>
          <option value="cad">CAD Tools</option>
          <option value="affiliate">Affiliate Shop</option>
        </select>
      </div>
    </div>
    <div id="azobssLikesList"><div class="az-like-empty">Loading likes...</div></div>
  </main>
  <script type="module" src="/assets/js/azobss-global-auth.js"></script>
  <script type="module" src="/assets/js/azobss-firebase-live-likes-sync.js"></script>
<script>document.addEventListener("click",e=>{const c=e.target.closest(".liked-item,.like-card,.product-card"); if(!c)return; const url=c.dataset.url||c.getAttribute("data-link")||''; const cat=(c.dataset.type||'').toLowerCase(); if(url){window.location=url;return;} if(cat.includes('cad')) window.location='/CAD-Tools-&-Resources/';});</script><script src="/assets/js/azobss-snow-particles.js" defer></script></body>
</html>
