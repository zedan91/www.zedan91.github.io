  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#081426;color:white;font-family:Arial,Helvetica,sans-serif;padding-top:58px;}
    .market-sticky-bar{
      position:fixed;top:0;left:0;right:0;z-index:3200;background:#000;border-bottom:1px solid rgba(218,165,32,.45);box-shadow:0 10px 24px rgba(0,0,0,.28)
    }
    .market-bar-inner{width:100%;margin:0;padding:0 26px 0 8px;box-sizing:border-box}
    .market-main-row{min-height:48px;display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:visible}
    .market-brand{display:inline-flex;align-items:center;flex:0 0 auto;width:126px;height:32px;overflow:hidden;border-radius:999px;text-decoration:none}
    .market-brand img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    .market-nav{display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;scrollbar-width:none}
    .market-nav::-webkit-scrollbar{display:none}
    .market-nav a,.market-icon-btn{color:#e5e7eb;text-decoration:none;font-size:clamp(11px,1vw,13px);line-height:1}
    .market-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border:1px solid rgba(148,163,184,.28);border-radius:999px;background:#0e1729;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.45)}

    @media(max-width:760px){
      body{padding-top:98px;}
      .market-bar-inner{padding:0 6px}
      .market-main-row{min-height:auto;padding-top:9px;gap:6px;flex-wrap:wrap}
      .market-brand{width:128px;min-width:128px;height:34px}
      .market-nav{order:3;width:100%;flex-basis:100%;gap:6px;overflow:hidden;padding-bottom:8px}
      .market-nav a{min-height:30px;padding:0 9px;font-size:11px}
      .nav-chat-pill{width:44px;min-width:44px;height:32px;padding:0}
      .nav-chat-pill svg{width:20px;height:20px}
      .site-auth-actions{margin-left:auto;margin-right:8px;gap:12px}
      .site-auth-btn{font-size:13px;white-space:nowrap}
      .market-user-tools{margin-left:auto;gap:8px}

    .az-like-loadmore-wrap{display:flex;justify-content:center;margin:18px 0 8px;}
    .az-like-loadmore{border:1px solid rgba(38,108,246,.55);background:#2563eb;color:#fff;border-radius:14px;padding:12px 22px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.45);}
    .az-like-loadmore:disabled{opacity:.65;cursor:not-allowed;}
</style>

<style>

/* Performance fix: remove heavy shining/glow effect on service cards */
.service-card::before,
.service-card::after,
.home-service-card::before,
.home-service-card::after,
.category-card::before,
.category-card::after,
.card::before,
.card::after{
  animation:none !important;
  transition:none !important;
  filter:none !important;
  box-shadow:none !important;
}

/* Only hovered service card expands slightly; other cards stay normal */
.service-card,
.home-service-card,
.category-card{
  transition:transform .18s ease, border-color .18s ease, background .18s ease !important;
  transform:none !important;
}

.service-card:hover,
.home-service-card:hover,
.category-card:hover{
  transform:translateY(-4px) scale(1.02) !important;
  z-index:5 !important;
}

/* Prevent neighbouring cards from expanding because of parent hover */
.services-grid:hover .service-card:not(:hover),
.services-grid:hover .home-service-card:not(:hover),
.services-grid:hover .category-card:not(:hover),
.service-grid:hover .service-card:not(:hover),
.cards-grid:hover .service-card:not(:hover){
  transform:none !important;
  filter:none !important;
  opacity:1 !important;
}

/* Disable global hover scaling that affects multiple cards */
.services-grid:hover,
.service-grid:hover,
.cards-grid:hover{
  transform:none !important;
}

</style>

<body>
  <header aria-label="Carousell style navigation" class="market-sticky-bar">
    <div class="market-bar-inner">
      <div class="market-main-row">
        <a aria-label="AZOBSS" class="market-brand" href="/">

        </a>
        <nav aria-label="AZOBSS quick actions" class="market-nav">
          <a aria-label="Chat" href="https://alvo.chat/6nZ2" rel="noopener" target="_blank"><span aria-label="WhatsApp" class="nav-whatsapp-circle"></span></a>
          <a class="nav-pa-bm-link is-hidden" hidden href="/PA-BM/" id="paBmNavButton">PA / BM</a>
          <a href="/Software-Tools/">Software</a>
          <a href="/CAD-Tools-&amp;-Resources/">CAD Tools</a>
          <a href="/affiliate-shop/">Affiliate Shop</a>
          <a href="/lucky-draw/">Lucky Draw</a>
          <a href="/tools/">Mini Web Tools</a>

            <button class="user-upgrade-btn" hidden id="userUpgradeButton" type="button">Upgrade</button>

              <a class="user-dropdown-item" href="/likes/" role="menuitem">Likes</a>

              <button class="user-dropdown-item" id="logoutButton" role="menuitem" type="button">Log out</button>

<span class="az-shop-cart-badge" data-az-shop-cart-badge>0</span>

  <main class="wrap">
    <div class="top">
      <div>
        <h1>❤️ Likes</h1>
        <p class="muted">Items you liked from Affiliate Shop, CAD Tools and Software Tools.</p>
      </div>
    </div>
    <div class="likes-controls">

<script>document.addEventListener("click",e=>{if(e.target.closest('.az-like-unlike-btn'))return; const c=e.target.closest(".liked-item,.like-card,.product-card"); if(!c)return; const url=c.dataset.url||c.getAttribute("data-link")||''; const cat=(c.dataset.type||'').toLowerCase(); if(url){window.location=url;return;} if(cat.includes('cad')) window.location='/CAD-Tools-&-Resources/';});</script><script id="azobss-shop-cart-js">
(function(){
  if(window.__azobssShopCartReady) return; window.__azobssShopCartReady=true;
  const getKey=()=>window.__azobssCurrentCartKey||'azobss_shop_cart_guest_v1';
  const moneyVal=v=>{const n=String(v||'').replace(/,/g,'').match(/[0-9]+(?:\.[0-9]+)?/);return n?Number(n[0]):0;};
  const fmt=n=>'RM'+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
  const read=()=>{try{return JSON.parse(localStorage.getItem(getKey())||'[]').filter(Boolean)}catch(e){return[]}};
  const save=a=>{localStorage.setItem(getKey(),JSON.stringify(a));window.dispatchEvent(new Event('azobss-shop-cart-updated'));try{updateBadges();render();}catch(e){}};
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function ensurePanel(){let p=document.getElementById('azShopCartPanel'); if(p)return p; p=document.createElement('div'); p.id='azShopCartPanel'; p.className='az-shop-cart-panel'; p.innerHTML='<div class="az-shop-cart-head"><h3>My Cart</h3><button class="az-shop-cart-close" type="button" aria-label="Close cart">×</button></div><div id="azShopCartBody"></div>'; document.body.appendChild(p); return p;}
  
window.__azobssCartClickLock=window.__azobssCartClickLock||new WeakMap();
function lockCartButton(btn){
 try{
   if(!btn) return false;
   if(window.__azobssCartClickLock.get(btn)) return true;
   window.__azobssCartClickLock.set(btn,true);
   setTimeout(()=>window.__azobssCartClickLock.delete(btn),400);
 }catch(e){}
 return false;
}
function updateBadges(){const total=read().reduce((s,i)=>s+Number(i.qty||1),0); document.querySelectorAll('[data-az-shop-cart-badge]').forEach(b=>{b.textContent=total; b.classList.toggle('is-show',total>0);});}
  function render(){const p=ensurePanel(), body=p.querySelector('#azShopCartBody'), items=read(); const totalQty=items.reduce((s,i)=>s+Number(i.qty||1),0); p.querySelector('h3').textContent='My Cart ('+totalQty+')'; if(!items.length){body.innerHTML='<div class="az-shop-cart-empty">Cart kosong.<br><small>Cart ini hanya untuk Software dan CAD Tools.</small></div>'; updateBadges(); return;} const total=items.reduce((s,i)=>s+moneyVal(i.price)*Number(i.qty||1),0); body.innerHTML=items.map((i,idx)=>`<div class="az-shop-cart-item"><div class="az-shop-cart-thumb">${i.image?`<img src="${esc(i.image)}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc((i.name||'?').slice(0,1))}</div><div><div class="az-shop-cart-title">${esc(i.name)}</div><div class="az-shop-cart-meta">${esc(i.category||i.source||'Software/CAD Tools')}</div><div class="az-shop-cart-price">${esc(i.price||'RM0')}</div></div><div class="az-shop-cart-actions"><span class="az-shop-cart-qty"><button type="button" data-az-cart-minus="${idx}">−</button><span>${Number(i.qty||1)}</span><button type="button" data-az-cart-plus="${idx}">+</button></span><button type="button" class="az-shop-cart-remove" data-az-cart-remove="${idx}" title="Remove">🗑</button></div></div>`).join('')+`<div class="az-shop-cart-total"><span>Total</span><strong>${fmt(total)}</strong></div><button class="az-shop-cart-checkout" type="button" data-az-cart-checkout>Go to Cart Checkout</button><div class="az-shop-cart-note">Nota: Cart ini hanya untuk Software dan CAD Tools. Ia tidak berkaitan dengan PA/BM cart.</div>`; updateBadges();}
  function openPanel(){render(); ensurePanel().classList.add('is-open');}
  function closePanel(){ensurePanel().classList.remove('is-open');}
  function add(item){const items=read(); const id=String(item.id||item.name||Date.now()); const src=String(item.source||''); const found=items.find(x=>String(x.id)===id && String(x.source||'')===src); if(found) found.qty=Number(found.qty||1)+1; else items.push({...item,id,source:src,qty:1,addedAt:Date.now()}); save(items); render(); updateBadges(); openPanel(); setTimeout(()=>{render();updateBadges();window.dispatchEvent(new Event('azobss-shop-cart-updated'));},60);}
  window.azobssAddShopCart=add; window.azobssOpenShopCart=openPanel; window.azobssShopCartItems=read; window.azobssRefreshShopCart=function(){try{render();updateBadges();}catch(e){}};
  document.addEventListener('click',function(e){
    const toggle=e.target.closest('[data-az-shop-cart-toggle]'); if(toggle){e.preventDefault(); const p=ensurePanel(); p.classList.contains('is-open')?closePanel():openPanel(); return;}
    if(e.target.closest('.az-shop-cart-close')){closePanel();return;}
    const rem=e.target.closest('[data-az-cart-remove]'); if(rem){const a=read(); a.splice(Number(rem.dataset.azCartRemove),1); save(a); render(); return;}
    const plus=e.target.closest('[data-az-cart-plus]'); if(plus){const a=read(); const i=a[Number(plus.dataset.azCartPlus)]; if(i)i.qty=Number(i.qty||1)+1; save(a); render(); return;}
    const minus=e.target.closest('[data-az-cart-minus]'); if(minus){const a=read(); const i=a[Number(minus.dataset.azCartMinus)]; if(i){i.qty=Number(i.qty||1)-1; if(i.qty<=0)a.splice(Number(minus.dataset.azCartMinus),1);} save(a); render(); return;}
    if(e.target.closest('[data-az-cart-checkout]')){
const items=read();
if(!items.length)return;
const totalAmount=items.reduce((s,i)=>s+((parseFloat(String(i.price||0).replace(/[^0-9.]/g,''))||0)*Number(i.qty||1)),0);
const totalQty=items.reduce((s,i)=>s+Number(i.qty||1),0);
const firstItem=items[0]||{};
const checkoutItem={
id:'CART-CHECKOUT',
name:`${totalQty} Item(s)`,
price:`RM${totalAmount.toFixed(2)}`,
qty:totalQty,
cartItems:items,
isCartCheckout:true,
downloadLink:firstItem.downloadLink||firstItem.secureDownloadLink||firstItem.premiumDownloadFileLink||'',
secureDownloadLink:firstItem.secureDownloadLink||firstItem.downloadLink||firstItem.premiumDownloadFileLink||'',
premiumDownloadFileLink:firstItem.premiumDownloadFileLink||firstItem.secureDownloadLink||firstItem.downloadLink||''
};
if(typeof window.azobssOpenPremiumPay==='function'){window.azobssOpenPremiumPay(checkoutItem); closePanel();}
else if(items[0].pageUrl){location.href=items[0].pageUrl;}
else {alert('Buka page Software Tools atau CAD Tools untuk checkout item ini.');}
return;
}
  });
  // AZOBSS fix: Buy Now is no longer hijacked by cart. Only .az-card-cart-btn adds items to this cart.
  window.addEventListener('azobss-shop-cart-updated',updateBadges); document.addEventListener('DOMContentLoaded',()=>{ensurePanel();render();updateBadges();}); if(document.readyState!=='loading'){ensurePanel();render();updateBadges();}
})();
</script>
<script type="module" id="azobss-cart-firestore-sync-js">
/* AZOBSS cart persistence:
   - Guest buyers: localStorage only.
   - Logged-in Firebase users: localStorage + Firestore sync.
*/
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';

(function(){
  if(window.__azobssCartFirestoreSyncReady) return;
  window.__azobssCartFirestoreSyncReady = true;

  let CART_KEY = 'azobss_shop_cart_guest_v1';
  window.__azobssCurrentCartKey = CART_KEY;
  const metaKey = () => CART_KEY + '_meta';
  const COLLECTION = 'userCarts';
  const firebaseConfig = {
    apiKey: 'AIzaSyDuf03esBSpddXAOwuP-uOmHVRp54pZyr8',
    authDomain: 'azobss.firebaseapp.com',
    projectId: 'azobss',
    storageBucket: 'azobss.firebasestorage.app',
    messagingSenderId: '159277716405',
    appId: '1:159277716405:web:17d8924b6b6380e2b77ffc'
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUid = '';
  let syncTimer = null;
  let loadingFromCloud = false;

  try{
    // Remove old shared cart key so logged-in cart cannot leak into guest view.
    if(localStorage.getItem('azobss_shop_cart_v1') !== null){
      localStorage.removeItem('azobss_shop_cart_v1');
      localStorage.removeItem('azobss_shop_cart_v1_meta');
    }
  }catch(e){}

  function readCart(){
    try{
      const parsed = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
    }catch(e){ return []; }
  }

  function saveCart(items){
    localStorage.setItem(CART_KEY, JSON.stringify(Array.isArray(items) ? items.filter(Boolean) : []));
    window.dispatchEvent(new Event('azobss-shop-cart-updated'));
  }

  function localUpdatedAt(){
    try{
      const meta = JSON.parse(localStorage.getItem(metaKey()) || '{}');
      return Number(meta.updatedAt || 0);
    }catch(e){ return 0; }
  }

  function markLocalUpdated(){
    if(loadingFromCloud) return;
    try{ localStorage.setItem(metaKey(), JSON.stringify({updatedAt:Date.now()})); }catch(e){}
  }

  function itemKey(i){
    return String(i?.source || '') + '::' + String(i?.id || i?.name || '');
  }

  function mergeCart(a,b){
    const map = new Map();
    [...(Array.isArray(a)?a:[]), ...(Array.isArray(b)?b:[])].filter(Boolean).forEach(item=>{
      const key = itemKey(item);
      if(!key || key === '::') return;
      const old = map.get(key);
      if(!old) map.set(key, {...item, qty:Number(item.qty||1)});
      else{
        const oldQty = Number(old.qty||1);
        const newQty = Number(item.qty||1);
        map.set(key, {...old, ...item, qty:Math.max(oldQty, newQty)});
      }
    });
    return Array.from(map.values());
  }

  async function pushCloud(){
    if(!currentUid || loadingFromCloud) return;
    const items = readCart();
    const totalQty = items.reduce((s,i)=>s+Number(i.qty||1),0);
    try{
      await setDoc(doc(db, COLLECTION, currentUid), {
        uid: currentUid,
        items,
        totalQty,
        updatedAtMs: Date.now(),
        updatedAt: serverTimestamp()
      }, {merge:true});
    }catch(err){
      console.warn('AZOBSS cart Firestore sync skipped:', err);
    }
  }

  async function pullCloud(user){
    currentUid = user?.uid || '';
    if(!currentUid) return;
    try{
      const ref = doc(db, COLLECTION, currentUid);
      const snap = await getDoc(ref);
      const localItems = readCart();
      const localTime = localUpdatedAt();
      if(snap.exists()){
        const data = snap.data() || {};
        const cloudItems = Array.isArray(data.items) ? data.items.filter(Boolean) : [];
        const cloudTime = Number(data.updatedAtMs || 0);
        loadingFromCloud = true;
        localStorage.setItem(CART_KEY, JSON.stringify(cloudItems));
        localStorage.setItem(metaKey(), JSON.stringify({updatedAt:cloudTime || Date.now()}));
        loadingFromCloud = false;
        window.dispatchEvent(new Event('azobss-shop-cart-updated'));
      }else if(localItems.length){
        await pushCloud();
      }else{
        loadingFromCloud = true;
        localStorage.setItem(CART_KEY, JSON.stringify([]));
        localStorage.setItem(metaKey(), JSON.stringify({updatedAt:Date.now()}));
        loadingFromCloud = false;
        window.dispatchEvent(new Event('azobss-shop-cart-updated'));
      }
      if(typeof window.azobssOpenShopCart === 'function'){
        window.dispatchEvent(new Event('azobss-shop-cart-updated'));
      }
    }catch(err){
      console.warn('AZOBSS cart Firestore load skipped:', err);
    }finally{
      loadingFromCloud = false;
    }
  }

  window.azobssCartDebug=function(){
    return {uid: currentUid, key: CART_KEY, items: readCart()};
  };
  window.addEventListener('azobss-shop-cart-updated', ()=>{
    markLocalUpdated();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushCloud, 150);
  });

  onAuthStateChanged(auth, user => {
    if(user){
      CART_KEY = 'azobss_shop_cart_user_' + user.uid + '_v1';
      window.__azobssCurrentCartKey = CART_KEY;
      pullCloud(user);
      window.dispatchEvent(new Event('azobss-shop-cart-updated'));
    }else{
      currentUid = '';
      CART_KEY = 'azobss_shop_cart_guest_v1';
      window.__azobssCurrentCartKey = CART_KEY;
      window.dispatchEvent(new Event('azobss-shop-cart-updated'));
    }
  });
})();
</script>
