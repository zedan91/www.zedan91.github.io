<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Likes | AZOBSS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#081426;color:white;font-family:Arial,Helvetica,sans-serif;padding-top:58px;}
    .market-sticky-bar{
      position:fixed;top:0;left:0;right:0;z-index:3200;background:#000;border-bottom:1px solid rgba(218,165,32,.45);box-shadow:0 10px 24px rgba(0,0,0,.28)
    }
    .market-bar-inner{width:100%;margin:0;padding:0 26px 0 8px;box-sizing:border-box}
    .market-main-row{min-height:48px;display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:visible}
    .market-brand{display:inline-flex;align-items:center;flex:0 0 auto;width:126px;height:32px;overflow:hidden;border-radius:999px;text-decoration:none}
    .market-brand img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    .market-nav{display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;scrollbar-width:none}
    .market-nav::-webkit-scrollbar{display:none}
    .market-nav a,.market-icon-btn{color:#e5e7eb;text-decoration:none;font-size:clamp(11px,1vw,13px);line-height:1}
    .market-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border:1px solid rgba(148,163,184,.28);border-radius:999px;background:#0e1729;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    .market-nav a:hover,.market-icon-btn:hover{color:#14b8a6}
    .nav-pa-bm-link.is-hidden{display:none!important}
    .nav-whatsapp-circle{width:38px!important;height:38px!important;min-width:38px!important;min-height:38px!important;border-radius:999px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;background:#22c55e!important;color:#fff!important;font-size:0!important;font-weight:900!important;box-shadow:0 8px 20px rgba(34,197,94,.25)!important;vertical-align:middle!important}
    .nav-whatsapp-circle::before{content:"💬";font-size:19px!important;line-height:1!important}
    a:has(.nav-whatsapp-circle){width:44px!important;min-width:44px!important;max-width:44px!important;height:44px!important;min-height:44px!important;padding:0!important;border-radius:999px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;background:transparent!important;border:0!important}
    .site-auth-actions{position:static;display:flex;align-items:center;gap:20px;flex:0 0 auto;z-index:auto;margin-right:10px;margin-left:auto}
    .site-auth-btn{display:inline-flex;align-items:center;border:0;border-radius:0;background:transparent;color:#fff;padding:0;font-size:14px;font-weight:bold;cursor:pointer;transition:.2s}
    .site-auth-btn:hover{color:#14b8a6}
    .market-user-tools{display:none;align-items:center;gap:20px;margin-left:auto;color:#fff;overflow:visible;white-space:nowrap}
    .user-menu{position:relative!important;top:auto!important;right:auto!important;display:none;align-items:center;gap:8px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;z-index:80;transform:none;cursor:pointer}
    .user-avatar{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#020617;border:1px solid rgba(20,184,166,.38);color:#d1d5db;font-size:7px;font-weight:bold}
    .user-name{color:#fff;font-weight:bold;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .user-menu::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;color:#9ca3af;transform:rotate(45deg);transition:transform .18s ease}
    .user-menu.is-open::after{transform:rotate(225deg)}
    .user-dropdown{position:absolute;top:calc(100% + 13px);right:0;display:none;width:280px;padding:10px 0;border:1px solid rgba(148,163,184,.22);background:#232526;color:#d4d4d4;box-shadow:0 18px 36px rgba(0,0,0,.45);cursor:default;z-index:120;border-radius:14px}
    .user-menu.is-open .user-dropdown{display:block}
    .user-dropdown-section{padding:8px 14px 5px;color:#94a3b8;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .user-dropdown-item{display:flex;width:100%;box-sizing:border-box;padding:10px 14px;border:0;background:transparent;color:#e5e7eb;text-decoration:none;text-align:left;font-weight:800;cursor:pointer}
    .user-dropdown-item:hover{background:rgba(20,184,166,.12);color:#67e8f9}
    .user-upgrade-btn{margin-left:4px;border:0;border-radius:999px;background:#22c55e;color:#052e16;font-weight:900;padding:3px 8px;font-size:11px;cursor:pointer}
    .market-icon-btn{display:inline-grid;place-items:center;width:24px;height:34px;color:#e5e7eb;text-decoration:none;border-radius:999px}
    .market-icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .market-icon-btn.is-likes-active svg{fill:#ff4d6d;stroke:#ff4d6d}
    @media (max-width:760px){
      body{padding-top:112px}
      .market-bar-inner{padding:0 6px}
      .market-main-row{min-height:auto;padding-top:9px;gap:6px;flex-wrap:wrap}
      .market-brand{width:116px;height:30px}
      .market-nav{order:3;width:100%;flex-basis:100%;gap:6px;overflow:hidden;padding-bottom:8px}
      .market-nav a{min-height:30px;padding:0 8px;font-size:11px}
      .site-auth-actions{margin-left:auto;margin-right:10px;gap:12px}
      .site-auth-btn{font-size:13px;white-space:nowrap}
      .market-user-tools{gap:12px;margin-left:auto}
      .market-user-tools .market-icon-btn:nth-of-type(3),.market-user-tools .market-icon-btn:nth-of-type(4){display:none}
    }

    .wrap{max-width:1100px;margin:0 auto;padding:28px 18px;}
    .top{display:block;margin-bottom:18px;}
    h1{margin:0;font-size:34px;}
    .likes-controls{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;align-items:end;margin:18px 0 18px;}
    .likes-control label{display:block;margin:0 0 6px;font-size:13px;font-weight:900;color:#dbeafe;}
    .likes-control input,.likes-control select{width:100%;height:42px;border:1px solid rgba(148,163,184,.35);border-radius:12px;background:#0f172a;color:#fff;padding:0 14px;font-weight:700;outline:none;}
    .likes-control input:focus,.likes-control select:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.12);}
    .muted{color:#9fb0c9;margin:8px 0 18px;}
    .az-like-empty{border:1px solid rgba(148,163,184,.25);background:rgba(15,23,42,.72);border-radius:14px;padding:16px;color:#cbd5e1}
    @media(max-width:760px){
      body{padding-top:98px;}
      .market-bar-inner{padding:0 6px}
      .market-main-row{min-height:auto;padding-top:9px;gap:6px;flex-wrap:wrap}
      .market-brand{width:128px;min-width:128px;height:34px}
      .market-nav{order:3;width:100%;flex-basis:100%;gap:6px;overflow:hidden;padding-bottom:8px}
      .market-nav a{min-height:30px;padding:0 9px;font-size:11px}
      .nav-chat-pill{width:44px;min-width:44px;height:32px;padding:0}
      .nav-chat-pill svg{width:20px;height:20px}
      .site-auth-actions{margin-left:auto;margin-right:8px;gap:12px}
      .site-auth-btn{font-size:13px;white-space:nowrap}
      .market-user-tools{margin-left:auto;gap:8px}
      .user-name{font-size:13px}
      .user-dropdown{position:fixed;top:92px;right:8px;width:210px;min-width:210px;max-height:68vh;overflow-y:auto}
      .wrap{padding:22px 14px}
      h1{font-size:28px}
      .likes-controls{grid-template-columns:1fr;gap:10px;}
      .likes-control input,.likes-control select{height:40px;font-size:13px;}
    }
  </style>

<style id="azobss-admin-compact-pagination-fix">
/* AZOBSS admin compact lists: 4 records per page + smaller row bars */
#registeredUsersList, #liveUsersList, #loginHistoryList, #guestHistoryList{gap:6px!important;}
#registeredUsersList .az-admin-user-row-card,
#registeredUsersList .az-admin-user-compact-card,
#liveUsersList .purchase-summary-item,
#loginHistoryList .purchase-summary-item,
#guestHistoryList .purchase-summary-item{
  min-height:0!important;
  padding:7px 10px!important;
  border-radius:9px!important;
  line-height:1.12!important;
  font-size:12px!important;
}
#registeredUsersList .az-admin-user-compact-card{
  display:grid!important;
  grid-template-columns:minmax(145px,1fr) 105px 126px 92px!important;
  gap:8px!important;
  align-items:center!important;
}
#registeredUsersList .az-admin-user-compact-name strong{font-size:12px!important;}
#registeredUsersList .az-admin-user-access-badge{font-size:10px!important;padding:2px 5px!important;white-space:nowrap!important;}
#registeredUsersList .az-admin-register-date{font-size:11px!important;white-space:nowrap!important;}
#registeredUsersList .az-admin-user-row-actions{display:flex!important;gap:6px!important;justify-content:flex-end!important;}
#registeredUsersList .az-admin-small-btn{height:24px!important;min-width:50px!important;padding:0 8px!important;border-radius:6px!important;font-size:10px!important;}
.admin-live-panel{margin-top:10px!important;padding-top:10px!important;}
.admin-live-panel h4{font-size:14px!important;margin:0 0 8px!important;}
.guest-history-stats{gap:8px!important;margin:0 0 8px!important;}
.guest-history-stat{padding:6px 10px!important;border-radius:8px!important;font-size:11px!important;}
.guest-history-stat strong{font-size:18px!important;margin-top:2px!important;}
#liveUsersList .admin-purchase-user-card,
#loginHistoryList .admin-purchase-user-card,
#guestHistoryList .admin-purchase-user-card{gap:4px!important;}
#liveUsersList .admin-purchase-user-top,
#loginHistoryList .admin-purchase-user-top,
#guestHistoryList .admin-purchase-user-top{
  display:flex!important;
  justify-content:space-between!important;
  gap:10px!important;
  align-items:center!important;
}
#liveUsersList .admin-purchase-user-top strong,
#loginHistoryList .admin-purchase-user-top strong,
#guestHistoryList .admin-purchase-user-top strong{font-size:12px!important;}
#liveUsersList .admin-purchase-user-top span,
#loginHistoryList .admin-purchase-user-top span,
#guestHistoryList .admin-purchase-user-top span{font-size:11px!important;white-space:nowrap!important;}
#liveUsersList .admin-purchase-user-details,
#loginHistoryList .admin-purchase-user-details,
#guestHistoryList .admin-purchase-user-details{
  display:flex!important;
  flex-wrap:wrap!important;
  gap:5px 12px!important;
  padding-top:4px!important;
  border-top:0!important;
  font-size:11px!important;
  color:#cbd5e1!important;
}
.guest-history-pagination{gap:5px!important;margin-top:7px!important;align-items:center!important;}
.guest-history-page-btn{min-width:28px!important;height:28px!important;padding:0 8px!important;border-radius:7px!important;font-size:11px!important;line-height:1!important;}
.guest-history-page-btn.is-compact{min-width:26px!important;height:26px!important;padding:0 7px!important;}
.guest-history-page-dots{display:inline-flex!important;align-items:center!important;height:26px!important;padding:0 2px!important;color:#94a3b8!important;font-weight:bold!important;}
@media(max-width:700px){
  #registeredUsersList .az-admin-user-compact-card{grid-template-columns:1fr!important;}
  #registeredUsersList .az-admin-user-row-actions{justify-content:flex-start!important;}
}
</style>
</head>
<body>
  <header aria-label="Carousell style navigation" class="market-sticky-bar">
    <div class="market-bar-inner">
      <div class="market-main-row">
        <a aria-label="AZOBSS" class="market-brand" href="/">
          <img alt="AZOBSS" src="/images/logo-azobss.jpg">
        </a>
        <nav aria-label="AZOBSS quick actions" class="market-nav">
          <a aria-label="Chat" href="https://alvo.chat/6nZ2" rel="noopener" target="_blank"><span aria-label="WhatsApp" class="nav-whatsapp-circle"></span></a>
          <a class="nav-pa-bm-link is-hidden" hidden href="/PA-BM/" id="paBmNavButton">PA / BM</a>
          <a href="/Software-Tools/">Software</a>
          <a href="/CAD-Tools-&amp;-Resources/">CAD Tools</a>
          <a href="/affiliate-shop/">Affiliate Shop</a>
          <a href="/lucky-draw/">Lucky Draw</a>
          <a href="/tools/">Mini Web Tools</a>
        </nav>
        <div class="site-auth-actions" id="siteAuthActions">
          <button class="site-auth-btn primary" data-auth-open="register" id="siteSignUpButton" type="button">Register</button>
          <button class="site-auth-btn" data-auth-open="login" id="siteSignInButton" type="button">Login</button>
        </div>
        <div class="market-user-tools" id="marketUserTools">
          <div aria-expanded="false" aria-haspopup="true" class="user-menu" id="userMenu" role="button" tabindex="0">
            <div class="user-avatar" id="userAvatar">AZ</div>
            <div class="user-name">Hello, <span id="signedInName"></span></div>
            <button class="user-upgrade-btn" hidden id="userUpgradeButton" type="button">Upgrade</button>
            <div aria-label="Account menu" class="user-dropdown" id="userDropdown" role="menu">
              <div class="user-dropdown-section">Buying</div>
              <a class="user-dropdown-item" href="/#purchases" role="menuitem">My purchases</a>
              <a class="user-dropdown-item" href="/likes/" role="menuitem">Likes</a>
              <div class="user-dropdown-section">Account</div>
              <button class="user-dropdown-item" id="profileSettingsButton" role="menuitem" type="button">Settings</button>
              <button class="user-dropdown-item" id="logoutButton" role="menuitem" type="button">Log out</button>
            </div>
          </div>
          <a aria-label="Likes" class="market-icon-btn is-likes-active" href="/likes/">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 4.6c-1.8-1.8-4.6-1.7-6.3.2L12 7.4 9.5 4.8C7.8 2.9 5 2.8 3.2 4.6c-1.9 1.9-1.9 5 0 6.9L12 20l8.8-8.5c1.9-1.9 1.9-5 0-6.9Z"></path></svg>
          </a>
          <a aria-label="Cart" class="market-icon-btn" href="/affiliate-shop/">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10.8l2-8H7"></path><path d="M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path><path d="M18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg>
          </a>
          <a aria-label="Notifications" class="market-icon-btn" href="/PA-BM/">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path><path d="M10 21h4"></path></svg>
          </a>
          <a aria-label="Chat" class="market-icon-btn" href="https://alvo.chat/6nZ2" rel="noopener" target="_blank">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 8.6 8.6 0 0 1-3.8-.9L3 20l1.1-4.3A8.2 8.2 0 0 1 3 11.5a8.5 8.5 0 1 1 18 0Z"></path></svg>
          </a>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="top">
      <div>
        <h1>❤️ Likes</h1>
        <p class="muted">Items you liked from Affiliate Shop, CAD Tools and Software Tools.</p>
      </div>
    </div>
    <div class="likes-controls">
      <div class="likes-control">
        <label for="likesSearchInput">Search likes</label>
        <input id="likesSearchInput" type="search" placeholder="Search liked items, category or page">
      </div>
      <div class="likes-control">
        <label for="likesSortSelect">Sort by</label>
        <select id="likesSortSelect">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">Name A-Z</option>
          <option value="za">Name Z-A</option>
          <option value="category">Category</option>
          <option value="software">Software</option>
          <option value="cad">CAD Tools</option>
          <option value="affiliate">Affiliate Shop</option>
        </select>
      </div>
    </div>
    <div id="azobssLikesList"><div class="az-like-empty">Loading likes...</div></div>
  </main>
  <script type="module" src="/assets/js/azobss-global-auth.js"></script>
  <script type="module" src="/assets/js/azobss-firebase-live-likes-sync.js"></script>
<script>document.addEventListener("click",e=>{if(e.target.closest('.az-like-unlike-btn'))return; const c=e.target.closest(".liked-item,.like-card,.product-card"); if(!c)return; const url=c.dataset.url||c.getAttribute("data-link")||''; const cat=(c.dataset.type||'').toLowerCase(); if(url){window.location=url;return;} if(cat.includes('cad')) window.location='/CAD-Tools-&-Resources/';});</script></body>
</html>
