  function ensureModals(){
    ensureStyle();
    if(document.getElementById('azSupportModal')) return;
    const div=document.createElement('div');
    div.innerHTML=`

  async function submitSupport(e){
    e.preventDefault();
    if(!currentUser){toast('Please login first.');return;}
    const subject=document.getElementById('azSupportSubject').value.trim()||'Support Request';
    const message=document.getElementById('azSupportMessage').value.trim();

    try{
      await addDoc(collection(db,'supportMessages'),{
        uid:currentUser.uid,email:currentUser.email||'',username:window.azobssCurrentUsername||currentUser.displayName||currentUser.email||'User',

      });

      document.getElementById('azSupportMessage').value='';

    }catch(err){console.error('AZOBSS support send failed:',err);alert('Support message failed: '+(err.message||err.code||err));}

    box.innerHTML='<div class="azobss-lite-item">Loading...</div>';
    try{
      let snap;

      });
      box.innerHTML=rows.join('')||'<div class="azobss-lite-item">No support messages.</div>';

        await updateDoc(doc(db,'supportMessages',id),{reply,status:'replied',repliedAt:serverTimestamp(),repliedAtMs:Date.now()});

      }));

  }

  async function publishNotification(e){
    if(e){e.preventDefault();e.stopPropagation();}
    console.log('AZOBSS CLEAN Publish Notification clicked');
    if(!adminNow()){alert('Admin only. Please login as zedan91.');return;}
    const type=document.getElementById('azNotificationType').value||'maintenance';
    const title=document.getElementById('azNotificationTitle').value.trim();
    const body=document.getElementById('azNotificationBody').value.trim();
    if(!title && !body){alert('Please write notification title or message.');return;}
    try{
      const payload={active:true,scope:'all',type,title:title||type.replaceAll('_',' '),body,createdAtMs:Date.now(),createdAt:serverTimestamp(),createdBy:currentUser?.email||'admin',createdByUid:currentUser?.uid||''};
      const ref=await addDoc(collection(db,'notifications'),payload);
      console.log('AZOBSS CLEAN notification published OK:',ref.id,payload);
      toast('Notification published.');
      document.getElementById('azNotificationTitle').value='';
      document.getElementById('azNotificationBody').value='';
      loadNotifications(); if(window.azobssUpdateBellBadge) setTimeout(window.azobssUpdateBellBadge,800);
    }catch(err){console.error('AZOBSS notification publish failed:',err);alert('Notification publish failed: '+(err.message||err.code||err));}
  }

  async function loadNotifications(){
    const box=document.getElementById('azNotificationList');
    if(!box) return;
    box.innerHTML='<div class="azobss-lite-item">Loading...</div>';
    try{
      let snap;
      try{snap=await getDocs(query(collection(db,'notifications'),where('active','==',true),orderBy('createdAtMs','desc'),limit(20)));}
      catch(e){console.warn('AZOBSS notification indexed query failed, fallback:',e);snap=await getDocs(collection(db,'notifications'));}
      const rows=[];
      snap.forEach(d=>{
        const x=d.data();
        if(x.active!==true) return;
        if(x.scope==='user' && x.uid && currentUser?.uid!==x.uid && !adminNow()) return;
        rows.push(x);
      });
      rows.sort((a,b)=>Number(b.createdAtMs||0)-Number(a.createdAtMs||0));
      box.innerHTML=rows.slice(0,20).map(x=>`<div class="azobss-lite-item"><strong>${esc(x.title||'Notification')}</strong><div>${esc(x.body||'')}</div><div class="azobss-lite-meta">${esc(x.type||'system')}</div></div>`).join('')||'<div class="azobss-lite-item">No notifications available.</div>';
    }catch(err){console.error('AZOBSS notification load failed:',err);box.innerHTML='<div class="azobss-lite-item">Unable to load notifications: '+esc(err.message||err.code||err)+'</div>';}
  }

  function bindIcons(){
    const candidates=[...document.querySelectorAll('header button,header a,.topbar button,.topbar a,.floating-nav button,.floating-nav a,.market-icon-btn,.nav-icon,.icon-btn,[role="button"]')].filter(el=>{
      const r=el.getBoundingClientRect();
      return r.width>=12 && r.height>=12 && r.top<95 && r.left>window.innerWidth*0.55;
    });
    const iconEls=candidates.filter(el=>el.querySelector('svg') || (el.textContent||'').trim()==='');
    if(iconEls.length>=2){
      const chat=iconEls[iconEls.length-1], bell=iconEls[iconEls.length-2];
      if(bell && bell.dataset.azCleanBell!=='1'){
        bell.dataset.azCleanBell='1'; bell.title='Notifications';
        bell.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();openModal('azBellModal');loadNotifications();},true);
      }
      if(chat && chat.dataset.azCleanChat!=='1'){
        chat.dataset.azCleanChat='1'; chat.title='Contact Admin / Support';
        chat.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();openModal('azSupportModal');loadSupport();},true);
      }
    }
  }

  window.azobssLoadNotifications=loadNotifications;
  window.azobssLoadSupportMessages=loadSupport;
  window.azobssPublishNotificationDirect=publishNotification;

  onAuthStateChanged(auth,user=>{
    currentUser=user||null;
    isAdmin=!!(user && String(user.email||'').toLowerCase()===ADMIN_EMAIL);
    document.body.classList.toggle('azobss-support-admin',adminNow());
    ensureModals(); bindIcons();
  });

  document.addEventListener('DOMContentLoaded',()=>{ensureModals();bindIcons();});
  if(document.readyState!=='loading'){ensureModals();bindIcons();}
  [300,800,1500,3000].forEach(t=>setTimeout(()=>{ensureModals();bindIcons();},t));
  new MutationObserver(()=>{ensureModals();bindIcons();}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script type="module" id="azobss-bell-badge-firestore-final">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';
import { getAuth } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
import { getFirestore, collection, getDocs, query, where, orderBy, limit } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';

(function(){
  if(window.__azBellBadgeFirestoreFinal) return;
  window.__azBellBadgeFirestoreFinal = true;

  const firebaseConfig = {
    apiKey:'AIzaSyDuf03esBSpddXAOwuP-uOmHVRp54pZyr8',
    authDomain:'azobss.firebaseapp.com',
    projectId:'azobss',
    storageBucket:'azobss.firebasestorage.app',
    messagingSenderId:'159277716405',
    appId:'1:159277716405:web:17d8924b6b6380e2b77ffc'
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const SEEN_KEY = 'azobss_notifications_seen_at_v2';

  function getBell(){
    let bell = document.querySelector('[title="Notifications"][data-az-clean-bell="1"],[title="Notifications"]');
    if(bell) return bell;

    const candidates=[...document.querySelectorAll('header button,header a,.topbar button,.topbar a,.floating-nav button,.floating-nav a,.market-icon-btn,.nav-icon,.icon-btn,[role="button"]')].filter(el=>{
      const r=el.getBoundingClientRect();
      return r.width>=12 && r.height>=12 && r.top<95 && r.left>window.innerWidth*0.55;
    });
    const iconEls=candidates.filter(el=>el.querySelector('svg') || (el.textContent||'').trim()==='');
    if(iconEls.length>=2) return iconEls[iconEls.length-2];
    return null;
  }

  function ensureBadge(){
    const bell=getBell();
    if(!bell) return null;
    let b=bell.querySelector('#azBellUnreadBadge');
    if(!b){
      b=document.createElement('span');
      b.id='azBellUnreadBadge';
      b.style.cssText='position:absolute;z-index:999999999;display:none;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;font-weight:900;line-height:18px;text-align:center;box-shadow:0 0 0 2px rgba(2,6,23,.95);pointer-events:none;top:-7px;right:-8px;';
      bell.style.position='relative';
      bell.appendChild(b);
    }
    return b;
  }

  function positionBadge(){
    return;
  }

  async function fetchUnreadCount(){
    const seen=Number(localStorage.getItem(SEEN_KEY)||0);
    let snap;
    try{
      snap=await getDocs(query(collection(db,'notifications'),where('active','==',true),orderBy('createdAtMs','desc'),limit(50)));
    }catch(e){
      console.warn('AZOBSS bell badge indexed read failed, fallback:',e);
      snap=await getDocs(collection(db,'notifications'));
    }

    let count=0;
    const uid=auth.currentUser?.uid||'';
    snap.forEach(d=>{
      const x=d.data();
      if(x.active!==true) return;
      if(x.scope==='user' && x.uid && x.uid!==uid) return;
      const ms=Number(x.createdAtMs||0);
      if(ms>seen) count++;
    });
    return count;
  }

  async function updateBadge(){
    const bell=getBell();
    const badge=ensureBadge();
    if(!bell){badge.style.display='none';return;}
    positionBadge();
    try{
      const count=await fetchUnreadCount();
      if(count>0){
        badge.textContent=String(Math.min(count,99));
        badge.style.display='block';
      }else{
        badge.style.display='none';
      }
    }catch(err){
      console.warn('AZOBSS bell badge update failed:',err);
      badge.style.display='none';
    }
  }

  function markSeen(){
    localStorage.setItem(SEEN_KEY,String(Date.now()));
    const badge=ensureBadge();
    badge.style.display='none';
  }

  document.addEventListener('click',function(e){
    const bell=getBell();
    if(bell && (e.target===bell || bell.contains(e.target))){
      markSeen();
      setTimeout(updateBadge,1200);
    }
  },true);

  window.azobssUpdateBellBadge = updateBadge;
  window.azobssMarkNotificationsSeen = markSeen;

  document.addEventListener('DOMContentLoaded',()=>setTimeout(updateBadge,1000));
  if(document.readyState!=='loading') setTimeout(updateBadge,1000);
  window.addEventListener('resize',positionBadge);
  window.addEventListener('scroll',positionBadge,true);
  setInterval(updateBadge,15000);
  setTimeout(updateBadge,2500);
  setTimeout(updateBadge,5000);
})();
</script>

<script type="module" id="azobss-admin-clear-notifications-final">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';
import { getAuth } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
import { getFirestore, collection, getDocs, query, orderBy, limit, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';

(function(){
  if(window.__azAdminClearNotificationsFinal) return;
  window.__azAdminClearNotificationsFinal = true;

  const firebaseConfig = {
    apiKey:'AIzaSyDuf03esBSpddXAOwuP-uOmHVRp54pZyr8',
    authDomain:'azobss.firebaseapp.com',
    projectId:'azobss',
    storageBucket:'azobss.firebasestorage.app',
    messagingSenderId:'159277716405',
    appId:'1:159277716405:web:17d8924b6b6380e2b77ffc'
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function isAdmin(){
    return document.body.classList.contains('azobss-support-admin')
      || String(auth.currentUser?.email||'').toLowerCase()==='zedan91@azobss.local'
      || (document.body.innerText||'').toLowerCase().includes('hello, zedan91');
  }

  function toast(msg){
    if(window.azShowToast) window.azShowToast(msg);
    else if(window.showToast) window.showToast(msg);
    else alert(msg);
  }

  async function clearNotifications(){
    if(!isAdmin()){
      alert('Admin only.');
      return;
    }

    const ok = confirm('Delete all notifications? This cannot be undone.');
    if(!ok) return;

    try{
      let total = 0;
      while(true){
        const snap = await getDocs(query(collection(db,'notifications'), orderBy('createdAtMs','desc'), limit(50)));
        if(snap.empty) break;

        const jobs = [];
        snap.forEach(d=>{
          total++;
          jobs.push(deleteDoc(doc(db,'notifications',d.id)));
        });

        await Promise.all(jobs);
        if(snap.size < 50) break;
      }

      localStorage.setItem('azobss_notifications_seen_at_v2', String(Date.now()));

      if(typeof window.azobssLoadNotifications === 'function'){
        await window.azobssLoadNotifications();
      }

      if(typeof window.azobssUpdateBellBadge === 'function'){
        setTimeout(window.azobssUpdateBellBadge, 500);
      }

      const badge = document.getElementById('azBellUnreadBadge');
      if(badge) badge.style.display = 'none';

      toast('Notifications cleared: ' + total);
    }catch(err){
      console.error('AZOBSS clear notifications failed:', err);
      alert('Clear notifications failed: ' + (err.message || err.code || err));
    }
  }

  function ensureButton(){
    const form = document.getElementById('azNotificationForm');
    if(!form || !isAdmin()) return;
    if(document.getElementById('azClearNotificationsBtn')) return;

    const btn = document.createElement('button');
    btn.id = 'azClearNotificationsBtn';
    btn.type = 'button';
    btn.className = 'azobss-lite-btn secondary';
    btn.style.marginLeft = '8px';
    btn.style.background = 'rgba(239,68,68,.18)';
    btn.style.color = '#fecaca';
    btn.style.border = '1px solid rgba(239,68,68,.35)';
    btn.textContent = 'Clear Notifications';
    btn.addEventListener('click', clearNotifications);

    const publish = form.querySelector('#azPublishNotificationBtn, button');
    if(publish && publish.parentNode){
      publish.insertAdjacentElement('afterend', btn);
    }else{
      form.appendChild(btn);
    }
  }

  document.addEventListener('DOMContentLoaded', ensureButton);
  if(document.readyState !== 'loading') ensureButton();
  [500,1500,3000,5000].forEach(t=>setTimeout(ensureButton,t));
  new MutationObserver(ensureButton).observe(document.documentElement,{childList:true,subtree:true});

  window.azobssClearNotifications = clearNotifications;
})();
</script>


<script id="azobss-exclusive-topbar-panels-final">
(function(){
  if(window.__azExclusiveTopbarPanelsFinal) return;
  window.__azExclusiveTopbarPanelsFinal = true;

  function qs(sel){return document.querySelector(sel);}
  function bellPanel(){return qs('#azBellModal');}
  function chatPanel(){return qs('#azSupportModal');}
  function cartPanel(){return qs('.az-shop-cart-panel,#azShopCartPanel,#shopCartPanel,[data-az-shop-cart-panel]');}

  function isBellBtn(el){
    return !!(el && el.closest && el.closest('[title="Notifications"],[aria-label="Notifications"]'));
  }

  function isChatBtn(el){
    return !!(el && el.closest && el.closest('[title="Contact Admin / Support"],[title="Contact Admin"],[title="Support"],[aria-label="Contact Admin / Support"]'));
  }

  function isCartBtn(el){
    return !!(el && el.closest && el.closest('[data-az-shop-cart-toggle],[title="My Cart"],[aria-label="My Cart"],.market-icon-btn.cart,.cart-toggle,.shop-cart-toggle'));
  }

  function closeBell(){ var p=bellPanel(); if(p) p.classList.remove('is-open'); }
  function closeChat(){ var p=chatPanel(); if(p) p.classList.remove('is-open'); }
  function closeCart(){
    var p=cartPanel();
    if(p){
      p.classList.remove('is-open');
      p.classList.remove('open');
    }
  }

  function openBell(){
    closeChat(); closeCart();
    var p=bellPanel(); if(p) p.classList.add('is-open');
    if(typeof window.azobssLoadNotifications==='function') window.azobssLoadNotifications();
    if(typeof window.azobssMarkNotificationsSeen==='function') window.azobssMarkNotificationsSeen();
  }

  function openChat(){
    closeBell(); closeCart();
    var p=chatPanel(); if(p) p.classList.add('is-open');
    if(typeof window.azobssLoadSupportMessages==='function') window.azobssLoadSupportMessages();
    if(typeof window.azMarkSupportSeen==='function') window.azMarkSupportSeen();
  }

  function toggleBell(){
    var p=bellPanel();
    var already=!!(p && p.classList.contains('is-open'));
    closeChat(); closeCart();
    if(already) closeBell(); else openBell();
  }

  function toggleChat(){
    var p=chatPanel();
    var already=!!(p && p.classList.contains('is-open'));
    closeBell(); closeCart();
    if(already) closeChat(); else openChat();
  }

  document.addEventListener('click',function(e){
    if(isBellBtn(e.target)){
      e.preventDefault();
      e.stopImmediatePropagation();
      e.stopPropagation();
      toggleBell();
      return;
    }

    if(isChatBtn(e.target)){
      e.preventDefault();
      e.stopImmediatePropagation();
      e.stopPropagation();
      toggleChat();
      return;
    }

    if(isCartBtn(e.target)){
      closeBell();
      closeChat();
      setTimeout(function(){closeBell();closeChat();},80);
      return;
    }
  },true);

<script id="azobss-affiliate-admin-software-category-runtime">
(function(){
  if(window.__azAffiliateAdminSoftwareCategoryRuntime) return;
  window.__azAffiliateAdminSoftwareCategoryRuntime=true;

  // Scope this helper to Affiliate Shop only.
  // It used to scan every <select> on every page and wrongly injected
  // a "Software" option into Mini Web Tools filters.
  const azPath=(location.pathname||'/').toLowerCase();
  if(!(azPath==='/affiliate-shop/' || azPath==='/affiliate-shop/index.html')) return;

  function isCategorySelect(sel){
    if(!sel || sel.tagName!=='SELECT') return false;
    const text=(sel.textContent||'').toLowerCase();
    const id=((sel.id||'')+' '+(sel.name||'')+' '+(sel.className||'')).toLowerCase();
    return id.includes('category') || text.includes('mobile & accessories') || text.includes('computer & accessories');
  }

  function addSoftwareOption(sel){
    if(!isCategorySelect(sel)) return;
    const has=[...sel.options].some(o=>(o.textContent||'').trim().toLowerCase()==='software' || String(o.value||'').toLowerCase()==='software');
    if(has) return;

    const opt=document.createElement('option');
    opt.value='software';
    opt.textContent='Software';

    const mobile=[...sel.options].find(o=>(o.textContent||'').trim().toLowerCase()==='mobile & accessories');
    if(mobile) sel.insertBefore(opt,mobile);
    else sel.insertBefore(opt,sel.firstChild);
  }

  function run(){
    document.querySelectorAll('select').forEach(addSoftwareOption);
  }

  document.addEventListener('DOMContentLoaded',run);
  if(document.readyState!=='loading') run();
  [300,800,1500,3000].forEach(t=>setTimeout(run,t));
  new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script id="azobss-role-hardening-041-js">
(function(){
  if(window.__azobssRoleHardening041) return;
  window.__azobssRoleHardening041 = true;

  function lower(v){ return String(v || '').trim().toLowerCase(); }

  function readStoredObjects(){
    var out = [];
    var keys = [
      'azobssCurrentUser','azobssUser','azobss_current_user','azobssSavedUser',
      'azobss_user_profile','azobssProfile','currentUser','userProfile',
      'azobss_auth_user','azobssLoginUser','azobss_logged_user'
    ];
    keys.forEach(function(k){
      try{
        var raw = localStorage.getItem(k) || sessionStorage.getItem(k);
        if(!raw) return;
        try{
          var obj = JSON.parse(raw);
          if(obj && typeof obj === 'object') out.push(obj);
        }catch(e){
          out.push({username:raw, raw:raw});
        }
      }catch(e){}
    });
    return out;
  }

  function detectRole(){
    var adminNames = ['zedan91'];
    var adminEmails = ['zedan9107@gmail.com','zedan91@azobss.local'];

    var visibleName = lower((document.querySelector('#signedInName') || {}).textContent);
    var userNameBox = lower((document.querySelector('.user-name') || {}).textContent);

    if(adminNames.indexOf(visibleName) !== -1 || adminNames.indexOf(userNameBox) !== -1 || userNameBox.indexOf('zedan91') !== -1){
      return 'admin';
    }

    var objs = readStoredObjects();
    for(var i=0;i<objs.length;i++){
      var u = objs[i] || {};
      var role = lower(u.role || u.userRole || u.accountRole || u.type || u.accessRole);
      var username = lower(u.usernameKey || u.username || u.userName || u.id || u.name || u.displayName || u.raw);
      var email = lower(u.email || u.authEmail || u.realEmail || u.userEmail);

      if(adminNames.indexOf(username) !== -1 || adminEmails.indexOf(email) !== -1){
        return 'admin';
      }

      if(role === 'admin' || u.isAdmin === true || u.admin === true || u.owner === true){
        return 'admin';
      }

      if(
        role === 'staff' || role === 'semiadmin' || role === 'semi-admin' ||
        role === 'semi_admin' || role === 'seller' || role === 'editor' ||
        u.isStaff === true || u.staff === true || u.staffDashboard === true ||
        u.canAccessStaffDashboard === true || u.canAddSoftware === true
      ){
        return 'staff';
      }
    }

    try{
      if(localStorage.getItem('azobss_admin_role_cache') === '1') return 'admin';
      if(localStorage.getItem('azobss_staff_role_cache') === '1') return 'staff';
    }catch(e){}

    return 'none';
  }

  function setRoleClass(role){
    document.body.classList.toggle('az-role-is-admin', role === 'admin');
    document.body.classList.toggle('is-admin', role === 'admin');
    document.body.classList.toggle('az-role-is-staff', role === 'staff');
    document.body.classList.toggle('az-role-is-stafflike', role === 'staff');
    document.body.setAttribute('data-az-current-role', role);
  }

  function hardHide(el){
    if(!el) return;
    el.style.setProperty('display','none','important');
    el.style.setProperty('visibility','hidden','important');
    el.style.setProperty('pointer-events','none','important');
    el.setAttribute('aria-hidden','true');
    el.tabIndex = -1;
  }

  function hardShow(el){
    if(!el) return;
    el.style.setProperty('display','inline-flex','important');
    el.style.setProperty('visibility','visible','important');
    el.style.setProperty('pointer-events','auto','important');
    el.removeAttribute('aria-hidden');
    el.tabIndex = 0;
  }

  function applyButtons(){
    var role = detectRole();
    setRoleClass(role);

    document.querySelectorAll('.azAdminDashboardBtn,.admin-dashboard-btn,.market-nav a[href="/admin/"],a[href="/admin/"].azobss-nav-chip').forEach(function(el){
      role === 'admin' ? hardShow(el) : hardHide(el);
    });

    document.querySelectorAll('.azStaffDashboardBtn,.staff-dashboard-btn,.market-nav a[href="/staff/"],a[href="/staff/"].azobss-nav-chip').forEach(function(el){
      role === 'staff' ? hardShow(el) : hardHide(el);
    });

    return role;
  }

  function showDenied(required, role){
    if(document.getElementById('azRoleDenyOverlay041')) return;
    var div = document.createElement('div');
    div.id = 'azRoleDenyOverlay041';
    div.innerHTML = '<div class="box"><h2>Access Restricted</h2><p>This page is for '+required+' only.<br>Current role: '+role+'</p><a href="/">Go to Home</a></div>';
    document.body.appendChild(div);
    setTimeout(function(){ location.href = '/'; }, 1800);
  }

  function guardPage(){
    var path = location.pathname.toLowerCase();
    var required = '';
    if(path === '/admin/' || path === '/admin/index.html') required = 'admin';
    if(path === '/staff/' || path === '/staff/index.html') required = 'staff';
    if(!required) return;

    var role = applyButtons();

    if(role === required) return;

    // Allow a short delay for auth UI/localStorage to initialize before blocking.
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      role = applyButtons();
      if(role === required){
        clearInterval(timer);
        return;
      }
      if(tries >= 8){
        clearInterval(timer);
        showDenied(required, role);
      }
    }, 350);
  }

  function run(){
    applyButtons();
    guardPage();
  }

  document.addEventListener('DOMContentLoaded', run);
  if(document.readyState !== 'loading') run();
  window.addEventListener('storage', run);
  window.addEventListener('focus', run);
  setTimeout(run, 300);
  setTimeout(run, 1200);
  setTimeout(run, 2500);
})();
</script>
