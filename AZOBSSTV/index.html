<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Perkhidmatan Ditamatkan | AZOBSS</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#eaf3ff;font-family:Arial,Helvetica,sans-serif;padding:24px}.card{width:min(560px,100%);border:1px solid #294766;border-radius:18px;background:#0b1a2b;padding:28px;text-align:center}.badge{display:inline-block;padding:6px 10px;border:1px solid #335878;border-radius:999px;color:#91cfff;font-weight:700;font-size:12px}.card h1{font-size:28px;margin:14px 0 10px}.card p{color:#b8c9dc;line-height:1.6;margin:0 0 20px}.card a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 18px;border-radius:12px;background:#168be8;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">AZOBSS</span>
    <h1>Perkhidmatan media telah ditamatkan</h1>
    <p>AZOBSS tidak lagi menyediakan fungsi penstriman atau penyiaran melalui halaman ini.</p>
    <a href="/">Kembali ke laman utama</a>
  </main>
  <script>
  (async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(String(r.scope||'').toLowerCase().includes('/azobsstv/')) await r.unregister();}}if('caches'in window){for(const k of await caches.keys()){if(String(k).toLowerCase().includes('azobsstv')) await caches.delete(k);}}}catch(_){}})();
  </script>
</body>
</html>
