<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Returning to AZOBSS Affiliate AI Poster</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08111f; color: #f4f7fb; }
    main { width: min(540px, calc(100% - 32px)); padding: 28px; border: 1px solid #29405f; border-radius: 8px; background: #111f33; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { color: #b9c8dc; line-height: 1.55; }
    a { display: inline-block; margin-top: 10px; padding: 12px 16px; border-radius: 6px; background: #1f6feb; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Returning to AZOBSS Affiliate AI Poster</h1>
    <p>Completing the secure Threads connection on this computer...</p>
    <a id="continue" href="#" hidden>Continue to the application</a>
  </main>
  <script>
    (() => {
      const localCallback = new URL("http://127.0.0.1:8787/oauth/callback/threads");
      localCallback.search = window.location.search;
      const continueLink = document.getElementById("continue");
      continueLink.href = localCallback.toString();
      continueLink.hidden = false;
      window.location.replace(localCallback.toString());
    })();
  </script>
</body>
</html>
