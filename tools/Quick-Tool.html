<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZOBSS Quick Tool</title>
<style>
:root{--bg:#07111f;--card:#101c2d;--card2:#13243a;--text:#eef5ff;--muted:#9fb2c8;--accent:#22c55e;--blue:#2563eb;--warn:#facc15;--danger:#ef4444;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#102544,#07111f 55%);color:var(--text);line-height:1.55}.wrap{max-width:1040px;margin:auto;padding:26px 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.22)}.brand{font-weight:900;color:#86efac;text-decoration:none}.back{color:#93c5fd;text-decoration:none;font-weight:800}.hero{display:flex;align-items:center;gap:14px;margin:14px 0 20px}.icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.32);font-size:28px}.title{font-size:30px;font-weight:900}.type{display:inline-flex;margin-top:5px;padding:5px 10px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.28);color:#bbf7d0;font-size:12px;font-weight:900}.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 18px 38px rgba(0,0,0,.25)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;margin:10px 0 6px;color:var(--muted);font-weight:800;font-size:13px}input,select,textarea{width:100%;min-height:44px;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:#07111f;color:var(--text);outline:none}textarea{min-height:160px;resize:vertical}button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 15px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;margin-top:12px}button.copy{background:#16a34a;color:#052e16}button.secondary{background:#0f172a;border:1px solid #334155}.result{margin-top:14px;padding:15px;border-radius:14px;background:#07111f;border:1px solid var(--line);white-space:pre-wrap;overflow:auto}.preview{min-height:58px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:#07111f}.muted{color:var(--muted)}.good{color:#86efac}.warn{color:#fde047}.bad{color:#fca5a5}.footer{text-align:center;color:#64748b;padding:28px 10px}@media(max-width:700px){.title{font-size:24px}.icon{width:50px;height:50px}.wrap{padding:18px 12px}.card{padding:15px}}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/tools/">AZOBSS Mini Web Tools</a><a class="back" href="/tools/">← Back to tools</a></div>
<div class="wrap">
  <div class="hero"><div class="icon" id="toolIcon">🛠️</div><div><div class="title" id="toolTitle">Quick Tool</div><div class="type" id="toolType">Tool</div></div></div>
  <div class="card"><div id="toolBody"></div><button class="copy" id="copyResult" type="button">Copy Result</button><div class="result" id="result">Enter values and run the tool.</div></div>
  <div class="footer">(c) 2026 AZOBSS.COM - Mini Utility Tools</div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const toolId=params.get('tool')||'unit-converter';
const result=$('result');
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function num(v){const n=parseFloat(String(v).replace(/,/g,''));return Number.isFinite(n)?n:0;}
function money(n){return 'RM '+Number(n||0).toFixed(2);}
function out(s){result.textContent=s;}
function copy(){navigator.clipboard?.writeText(result.textContent||'').then(()=>{const old=$('copyResult').textContent;$('copyResult').textContent='Copied ✔';setTimeout(()=>$('copyResult').textContent=old,900);}).catch(()=>{});} 
$('copyResult')?.addEventListener('click',copy);
const tools={
'unit-converter':{title:'Unit Converter',type:'Converter',icon:'📏',html:`<div class="grid"><div><label>Value<input id="v" type="number" step="any" value="1"></label></div><div><label>Convert<select id="mode"><option value="m-ft">Meter to Feet</option><option value="ft-m">Feet to Meter</option><option value="kg-lb">KG to Pound</option><option value="lb-kg">Pound to KG</option><option value="c-f">Celsius to Fahrenheit</option><option value="f-c">Fahrenheit to Celsius</option><option value="cm-in">CM to Inch</option><option value="in-cm">Inch to CM</option></select></label></div></div><button id="run">Convert</button>`,run(){const v=num($('v').value),m=$('mode').value;let r='',u='';if(m==='m-ft'){r=v*3.28084;u='ft'}if(m==='ft-m'){r=v/3.28084;u='m'}if(m==='kg-lb'){r=v*2.20462;u='lb'}if(m==='lb-kg'){r=v/2.20462;u='kg'}if(m==='c-f'){r=v*9/5+32;u='°F'}if(m==='f-c'){r=(v-32)*5/9;u='°C'}if(m==='cm-in'){r=v/2.54;u='in'}if(m==='in-cm'){r=v*2.54;u='cm'}out(`${v} → ${Number(r).toFixed(4)} ${u}`)}},
'file-size-converter':{title:'File Size Converter',type:'Converter',icon:'🗂️',html:`<div class="grid"><label>Size<input id="v" type="number" step="any" value="1024"></label><label>From<select id="from"><option>B</option><option>KB</option><option selected>MB</option><option>GB</option><option>TB</option></select></label></div><button id="run">Convert</button>`,run(){const units=['B','KB','MB','GB','TB'];const bytes=num($('v').value)*Math.pow(1024,units.indexOf($('from').value));out(units.map((u,i)=>`${u}: ${(bytes/Math.pow(1024,i)).toLocaleString(undefined,{maximumFractionDigits:4})}`).join('\n'))}},
'percentage-calculator':{title:'Percentage Calculator',type:'Calculator',icon:'📊',html:`<div class="grid"><label>Number<input id="a" type="number" step="any" value="100"></label><label>Percent %<input id="p" type="number" step="any" value="10"></label></div><button id="run">Calculate</button>`,run(){const a=num($('a').value),p=num($('p').value);out(`${p}% of ${a} = ${(a*p/100).toFixed(2)}\n${a} + ${p}% = ${(a*(1+p/100)).toFixed(2)}\n${a} - ${p}% = ${(a*(1-p/100)).toFixed(2)}`)}},
'loan-calculator':{title:'Loan Calculator',type:'Finance',icon:'🏦',html:`<div class="grid"><label>Loan amount<input id="amount" type="number" value="10000"></label><label>Annual interest %<input id="rate" type="number" step="any" value="5"></label><label>Years<input id="years" type="number" step="any" value="5"></label></div><button id="run">Calculate</button>`,run(){const P=num($('amount').value),r=num($('rate').value)/100/12,n=Math.max(1,num($('years').value)*12);const pay=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;out(`Monthly payment: ${money(pay)}\nTotal payment: ${money(pay*n)}\nEstimated interest: ${money(pay*n-P)}`)}},
'sst-calculator':{title:'SST Calculator',type:'Finance',icon:'🧾',html:`<div class="grid"><label>Amount<input id="amount" type="number" step="any" value="100"></label><label>Tax %<input id="rate" type="number" step="any" value="8"></label><label>Mode<select id="mode"><option value="add">Add tax</option><option value="remove">Remove tax from total</option></select></label></div><button id="run">Calculate</button>`,run(){const a=num($('amount').value),r=num($('rate').value)/100;if($('mode').value==='add')out(`Before tax: ${money(a)}\nTax: ${money(a*r)}\nTotal: ${money(a*(1+r))}`);else{const before=a/(1+r);out(`Total: ${money(a)}\nBefore tax: ${money(before)}\nTax included: ${money(a-before)}`)}}},
'password-generator':{title:'Password Generator',type:'Security',icon:'🔐',html:`<div class="grid"><label>Length<input id="len" type="number" min="6" max="64" value="16"></label><label><input id="sym" type="checkbox" checked> Include symbols</label></div><button id="run">Generate</button>`,run(){const len=Math.min(64,Math.max(6,num($('len').value)||16));const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'+($('sym').checked?'!@#$%^&*_-+=':'');let s='';const arr=new Uint32Array(len);crypto.getRandomValues(arr);for(let i=0;i<len;i++)s+=chars[arr[i]%chars.length];out(s)}},
'password-strength-checker':{title:'Password Strength Checker',type:'Security',icon:'🛡️',html:`<label>Password<input id="pw" type="password" placeholder="Type password to check"></label><button id="run">Check</button>`,run(){const p=$('pw').value||'';let score=0,h=[];if(p.length>=12)score+=2;else h.push('Use at least 12 characters.');if(/[a-z]/.test(p)&&/[A-Z]/.test(p))score++;else h.push('Mix uppercase and lowercase.');if(/\d/.test(p))score++;else h.push('Add numbers.');if(/[^A-Za-z0-9]/.test(p))score++;else h.push('Add symbols.');const label=score>=5?'Strong':score>=3?'Medium':'Weak';out(`Strength: ${label}\nScore: ${score}/5\n${h.length?'Suggestions:\n- '+h.join('\n- '):'Looks good.'}`)}},
'qr-code-generator':{title:'QR Code Generator',type:'Converter',icon:'▦',html:`<label>Text or URL<textarea id="txt" placeholder="https://www.azobss.com">https://www.azobss.com</textarea></label><button id="run">Generate QR</button><div class="preview"><img id="qr" alt="QR preview" style="max-width:220px;width:100%;display:none;border-radius:12px"></div>`,run(){const t=($('txt').value||'').trim();if(!t){out('Enter text or URL first.');return}const url='https://api.qrserver.com/v1/create-qr-code/?size=260x260&data='+encodeURIComponent(t);$('qr').src=url;$('qr').style.display='block';out('QR generated. Open or save the QR image from the preview.\n'+url)}},
'word-counter':{title:'Word Counter',type:'Text Tools',icon:'🔢',html:`<label>Text<textarea id="txt" placeholder="Paste your text here"></textarea></label><button id="run">Count</button>`,run(){const t=$('txt').value||'';const words=(t.trim().match(/\S+/g)||[]).length;const chars=t.length;const charsNoSpace=t.replace(/\s/g,'').length;const lines=t?t.split(/\r?\n/).length:0;const mins=Math.max(1,Math.ceil(words/200));out(`Words: ${words}\nCharacters: ${chars}\nCharacters without spaces: ${charsNoSpace}\nLines: ${lines}\nReading time: ~${mins} minute(s)`) }},
'json-formatter':{title:'JSON Formatter',type:'Developer',icon:'🧩',html:`<label>JSON<textarea id="txt" placeholder='{"hello":"world"}'></textarea></label><button id="format">Format</button><button id="minify" class="secondary">Minify</button>`,init(){ $('format').onclick=()=>{try{out(JSON.stringify(JSON.parse($('txt').value),null,2))}catch(e){out('Invalid JSON: '+e.message)}};$('minify').onclick=()=>{try{out(JSON.stringify(JSON.parse($('txt').value)))}catch(e){out('Invalid JSON: '+e.message)}};},run(){}},
'url-encoder-decoder':{title:'URL Encoder / Decoder',type:'Developer',icon:'🔗',html:`<label>Text / URL<textarea id="txt">https://www.azobss.com/tools/?q=hello world</textarea></label><button id="enc">Encode</button><button id="dec" class="secondary">Decode</button>`,init(){ $('enc').onclick=()=>out(encodeURIComponent($('txt').value));$('dec').onclick=()=>{try{out(decodeURIComponent($('txt').value))}catch(e){out('Decode error: '+e.message)}};},run(){}},
'base64-encoder-decoder':{title:'Base64 Encoder / Decoder',type:'Developer',icon:'🧬',html:`<label>Text<textarea id="txt">AZOBSS</textarea></label><button id="enc">Encode</button><button id="dec" class="secondary">Decode</button>`,init(){ $('enc').onclick=()=>out(btoa(unescape(encodeURIComponent($('txt').value))));$('dec').onclick=()=>{try{out(decodeURIComponent(escape(atob($('txt').value))))}catch(e){out('Decode error: '+e.message)}};},run(){}},
'sha256-hash-generator':{title:'SHA-256 Hash Generator',type:'Developer',icon:'🔏',html:`<label>Text<textarea id="txt">AZOBSS</textarea></label><button id="run">Generate Hash</button>`,async run(){const data=new TextEncoder().encode($('txt').value);const buf=await crypto.subtle.digest('SHA-256',data);out(Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''))}},
'color-converter':{title:'Color Converter',type:'Image / Design',icon:'🎨',html:`<div class="grid"><label>HEX<input id="hex" value="#22c55e"></label><label>Preview<input id="color" type="color" value="#22c55e"></label></div><button id="run">Convert</button><div class="preview" id="preview">Preview</div>`,init(){ $('color').oninput=()=>{$('hex').value=$('color').value;tools['color-converter'].run()};},run(){let h=$('hex').value.trim();if(!h.startsWith('#'))h='#'+h;if(!/^#[0-9a-f]{6}$/i.test(h)){out('Use HEX format like #22c55e');return}const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);$('color').value=h;$('preview').style.background=h;$('preview').style.color=(r*0.299+g*0.587+b*0.114)>160?'#020617':'#fff';out(`HEX: ${h.toUpperCase()}\nRGB: rgb(${r}, ${g}, ${b})`) }},
'timestamp-converter':{title:'Timestamp Converter',type:'Developer',icon:'🕒',html:`<div class="grid"><label>Unix timestamp seconds<input id="ts" value=""></label><label>Date time<input id="dt" type="datetime-local"></label></div><button id="now">Use Current Time</button><button id="run">Convert</button>`,init(){const n=new Date();$('dt').value=n.toISOString().slice(0,16);$('ts').value=Math.floor(Date.now()/1000);$('now').onclick=()=>{const d=new Date();$('dt').value=d.toISOString().slice(0,16);$('ts').value=Math.floor(Date.now()/1000);tools['timestamp-converter'].run();};},run(){const ts=num($('ts').value);const d1=new Date(ts*1000);const d2=new Date($('dt').value);out(`Timestamp → ${d1.toString()}\nDate input → ${Math.floor(d2.getTime()/1000)} seconds`) }},
'age-calculator':{title:'Age Calculator',type:'Calculator',icon:'🎂',html:`<div class="grid"><label>Birth date<input id="birth" type="date"></label><label>Until date<input id="until" type="date"></label></div><button id="run">Calculate</button>`,init(){const d=new Date();$('until').value=d.toISOString().slice(0,10);},run(){const b=new Date($('birth').value),u=new Date($('until').value);if(!b.getTime()){out('Choose birth date.');return}let years=u.getFullYear()-b.getFullYear();const m=u.getMonth()-b.getMonth();if(m<0||(m===0&&u.getDate()<b.getDate()))years--;const days=Math.floor((u-b)/86400000);out(`Age: ${years} year(s)\nTotal days: ${days.toLocaleString()} day(s)`) }},
'date-difference-calculator':{title:'Date Difference Calculator',type:'Calculator',icon:'📅',html:`<div class="grid"><label>Start date<input id="a" type="date"></label><label>End date<input id="b" type="date"></label></div><button id="run">Calculate</button>`,run(){const a=new Date($('a').value),b=new Date($('b').value);if(!a.getTime()||!b.getTime()){out('Choose both dates.');return}const days=Math.round((b-a)/86400000);out(`Difference: ${Math.abs(days).toLocaleString()} day(s)\nWeeks: ${(Math.abs(days)/7).toFixed(2)}\nDirection: ${days>=0?'after start date':'before start date'}`)}},
'aspect-ratio-calculator':{title:'Aspect Ratio Calculator',type:'Image / Design',icon:'🖼️',html:`<div class="grid"><label>Original width<input id="ow" type="number" value="1920"></label><label>Original height<input id="oh" type="number" value="1080"></label><label>New width<input id="nw" type="number" value="1280"></label><label>New height<input id="nh" type="number" placeholder="Auto"></label></div><button id="run">Calculate</button>`,run(){const ow=num($('ow').value),oh=num($('oh').value),nw=num($('nw').value),nh=num($('nh').value);if(!ow||!oh){out('Enter original width and height.');return}const ratio=ow/oh;const outW=nh?Math.round(nh*ratio):nw;const outH=nw?Math.round(nw/ratio):nh;out(`Aspect ratio: ${ow}:${oh} ≈ ${ratio.toFixed(4)}\nNew size: ${outW || 0} × ${outH || 0}`)}},
'screen-ppi-calculator':{title:'Screen PPI Calculator',type:'Hardware',icon:'🔎',html:`<div class="grid"><label>Width pixels<input id="w" type="number" value="1920"></label><label>Height pixels<input id="h" type="number" value="1080"></label><label>Diagonal inches<input id="d" type="number" step="any" value="24"></label></div><button id="run">Calculate</button>`,run(){const w=num($('w').value),h=num($('h').value),d=num($('d').value);const ppi=Math.sqrt(w*w+h*h)/d;out(`PPI: ${ppi.toFixed(2)}\nDiagonal pixels: ${Math.sqrt(w*w+h*h).toFixed(0)}`)}},
'subnet-calculator':{title:'IP Subnet Calculator',type:'Network / Internet',icon:'🌐',html:`<div class="grid"><label>IPv4<input id="ip" value="192.168.1.10"></label><label>CIDR<input id="cidr" type="number" min="1" max="32" value="24"></label></div><button id="run">Calculate</button>`,run(){function ipToInt(ip){return ip.split('.').reduce((a,b)=>(a<<8)+(parseInt(b)||0),0)>>>0}function intToIp(n){return [24,16,8,0].map(s=>(n>>>s)&255).join('.')}const ip=$('ip').value.trim(),cidr=Math.min(32,Math.max(1,num($('cidr').value)));if(!/^\d+\.\d+\.\d+\.\d+$/.test(ip)){out('Enter valid IPv4.');return}const mask=(0xffffffff << (32-cidr))>>>0;const n=ipToInt(ip)&mask;const b=n | (~mask>>>0);const hosts=cidr>=31?0:Math.max(0,Math.pow(2,32-cidr)-2);out(`Network: ${intToIp(n)}/${cidr}\nSubnet mask: ${intToIp(mask)}\nBroadcast: ${intToIp(b)}\nUsable hosts: ${hosts.toLocaleString()}`)}},
'text-case-converter':{title:'Text Case Converter',type:'Text Tools',icon:'📝',html:`<label>Text<textarea id="txt">AZOBSS mini web tools</textarea></label><button id="upper">UPPER</button><button id="lower" class="secondary">lower</button><button id="titleBtn" class="secondary">Title Case</button><button id="slug" class="secondary">slug-case</button>`,init(){const get=()=>$('txt').value; $('upper').onclick=()=>out(get().toUpperCase());$('lower').onclick=()=>out(get().toLowerCase());$('titleBtn').onclick=()=>out(get().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()));$('slug').onclick=()=>out(get().toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''));},run(){}}
};
const tool=tools[toolId]||tools['unit-converter'];
document.title=tool.title+' - AZOBSS Tools';$('toolTitle').textContent=tool.title;$('toolType').textContent=tool.type;$('toolIcon').textContent=tool.icon;$('toolBody').innerHTML=tool.html;if(tool.init)tool.init();const runBtn=$('run');if(runBtn)runBtn.addEventListener('click',()=>tool.run&&tool.run());try{if(tool.run)tool.run();}catch(e){}
})();
</script>
</body>
</html>
