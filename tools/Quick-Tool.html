<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const toolId=params.get('tool')||'unit-converter';
const result=$('result');
const nf=new Intl.NumberFormat('en-MY',{maximumFractionDigits:4});
function num(v){const n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0;}
function fmt(n,d=2){return Number(n||0).toLocaleString('en-MY',{maximumFractionDigits:d,minimumFractionDigits:d});}
function fmtFlex(n,d=4){return Number(n||0).toLocaleString('en-MY',{maximumFractionDigits:d});}
function money(n){return 'RM '+fmt(n,2);}
function escHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]||m));}
function renderRichResult(s){
  const plain=String(s??'');
  result.dataset.plain=plain;
  if(!plain.trim()){result.innerHTML='<div class="result-empty">Result cleared. Enter values and run the tool again.</div>';return;}
  const blocks=plain.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  result.innerHTML=blocks.map((block,idx)=>{
    const lines=block.split(/\n/).map(x=>x.trim()).filter(Boolean);
    const head=lines.shift()||'Result';
    const body=lines.map(line=>{
      const m=line.match(/^([^:]{1,38}):\s*(.+)$/);
      if(m){return `<div class="result-row"><span class="result-key">${escHtml(m[1])}</span><span class="result-val">${escHtml(m[2])}</span></div>`;}
      return `<div class="result-line">${escHtml(line)}</div>`;
    }).join('');
    return `<section class="result-section ${idx===0?'primary':''}"><div class="result-section-title">${escHtml(head)}</div>${body}</section>`;
  }).join('');
}
function out(s){renderRichResult(s);}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){const t=b;b=a%b;a=t;}return a||1;}
function safeDate(v){const d=new Date(v);return Number.isFinite(d.getTime())?d:null;}
function copy(){navigator.clipboard?.writeText(result.dataset.plain||result.textContent||'').then(()=>{const old=$('copyResult').textContent;$('copyResult').textContent='Copied ✔';setTimeout(()=>$('copyResult').textContent=old,900);}).catch(()=>{});} 
$('copyResult')?.addEventListener('click',copy);
$('clearResult')?.addEventListener('click',()=>out(''));
const tools={
'unit-converter':{title:'Unit Converter',type:'Converter',icon:'📏',html:`<div class="grid"><label>Value<input id="v" type="number" step="any" value="1"></label><label>Convert<select id="mode"><option value="m-ft">Meter to Feet</option><option value="ft-m">Feet to Meter</option><option value="km-mi">Kilometer to Mile</option><option value="mi-km">Mile to Kilometer</option><option value="cm-in">Centimeter to Inch</option><option value="in-cm">Inch to Centimeter</option><option value="kg-lb">Kilogram to Pound</option><option value="lb-kg">Pound to Kilogram</option><option value="c-f">Celsius to Fahrenheit</option><option value="f-c">Fahrenheit to Celsius</option><option value="l-gal">Liter to US Gallon</option><option value="gal-l">US Gallon to Liter</option><option value="sqm-sqft">Square Meter to Square Feet</option><option value="sqft-sqm">Square Feet to Square Meter</option></select></label></div><button id="run">Convert</button><p class="tool-note">Shows the result, reverse value and formula reference.</p>`,run(){const v=num($('v').value),m=$('mode').value;const map={
'm-ft':['m','ft',x=>x*3.280839895,'1 m = 3.28084 ft'],'ft-m':['ft','m',x=>x/3.280839895,'1 ft = 0.3048 m'],'km-mi':['km','mi',x=>x*0.621371192,'1 km = 0.621371 mi'],'mi-km':['mi','km',x=>x/0.621371192,'1 mi = 1.60934 km'],'cm-in':['cm','in',x=>x/2.54,'1 in = 2.54 cm'],'in-cm':['in','cm',x=>x*2.54,'1 in = 2.54 cm'],'kg-lb':['kg','lb',x=>x*2.2046226218,'1 kg = 2.20462 lb'],'lb-kg':['lb','kg',x=>x/2.2046226218,'1 lb = 0.453592 kg'],'c-f':['°C','°F',x=>x*9/5+32,'°F = °C × 9/5 + 32'],'f-c':['°F','°C',x=>(x-32)*5/9,'°C = (°F - 32) × 5/9'],'l-gal':['L','US gal',x=>x*0.264172052,'1 L = 0.264172 US gal'],'gal-l':['US gal','L',x=>x/0.264172052,'1 US gal = 3.78541 L'],'sqm-sqft':['m²','ft²',x=>x*10.763910417,'1 m² = 10.7639 ft²'],'sqft-sqm':['ft²','m²',x=>x/10.763910417,'1 ft² = 0.092903 m²']};const r=map[m];const ans=r[2](v);out(`Result\n${fmtFlex(v)} ${r[0]} = ${fmtFlex(ans)} ${r[1]}\n\nReverse check\n${fmtFlex(ans)} ${r[1]} ≈ ${fmtFlex(v)} ${r[0]}\n\nFormula\n${r[3]}\n\nTip\nFor technical work, round only at the final step so the result stays accurate.`);}},
'file-size-converter':{title:'File Size Converter',type:'Converter',icon:'🗂️',html:`<div class="grid"><label>Size<input id="v" type="number" step="any" value="1024"></label><label>From<select id="from"><option>B</option><option>KB</option><option selected>MB</option><option>GB</option><option>TB</option></select></label></div><button id="run">Convert</button><p class="tool-note">Uses binary storage conversion: 1 KB = 1024 bytes.</p>`,run(){const units=['B','KB','MB','GB','TB'];const from=$('from').value;const bytes=num($('v').value)*Math.pow(1024,units.indexOf(from));const decimalBytes=num($('v').value)*Math.pow(1000,units.indexOf(from));const rows=units.map((u,i)=>`${u.padEnd(2)}: ${fmtFlex(bytes/Math.pow(1024,i),4)}`).join('\n');out(`Binary conversion\n${rows}\n\nBytes\n${Math.round(bytes).toLocaleString('en-MY')} bytes\n\nDecimal comparison\nIf using decimal marketing units, it is about ${Math.round(decimalBytes).toLocaleString('en-MY')} bytes.\n\nNote\nWindows often shows binary-based size, while drive packaging often uses decimal size. This is why a 1TB drive can appear smaller in Windows.`);}},
'percentage-calculator':{title:'Percentage Calculator',type:'Calculator',icon:'📊',html:`<div class="grid"><label>Value A<input id="a" type="number" step="any" value="100"></label><label>Value B / Percent<input id="b" type="number" step="any" value="10"></label><label>Mode<select id="mode"><option value="of">B% of A</option><option value="what">A is what % of B</option><option value="change">Percentage change from A to B</option><option value="discount">Discount B% from A</option><option value="increase">Increase A by B%</option></select></label></div><button id="run">Calculate</button>`,run(){const a=num($('a').value),b=num($('b').value),m=$('mode').value;let s='';if(m==='of')s=`${b}% of ${a} = ${fmtFlex(a*b/100)}\nFormula: A × B / 100`;if(m==='what')s=`${a} is ${b?fmtFlex(a/b*100):'0'}% of ${b}\nFormula: A / B × 100`;if(m==='change')s=`Change from ${a} to ${b}: ${a?fmtFlex((b-a)/a*100):'0'}%\nDifference: ${fmtFlex(b-a)}\nFormula: (B - A) / A × 100`;if(m==='discount')s=`Original: ${money(a)}\nDiscount ${b}%: ${money(a*b/100)}\nFinal price: ${money(a*(1-b/100))}`;if(m==='increase')s=`Original: ${money(a)}\nIncrease ${b}%: ${money(a*b/100)}\nNew value: ${money(a*(1+b/100))}`;out(`${s}\n\nExtra quick values\n10% = ${fmtFlex(a*.10)}\n20% = ${fmtFlex(a*.20)}\n50% = ${fmtFlex(a*.50)}`);}},
'loan-calculator':{title:'Loan Calculator',type:'Finance',icon:'🏦',html:`<div class="grid"><label>Loan amount<input id="amount" type="number" value="10000"></label><label>Annual interest %<input id="rate" type="number" step="any" value="5"></label><label>Years<input id="years" type="number" step="any" value="5"></label><label>Extra monthly payment<input id="extra" type="number" step="any" value="0"></label></div><button id="run">Calculate</button>`,run(){const P=num($('amount').value),annual=num($('rate').value),r=annual/100/12,n=Math.max(1,Math.round(num($('years').value)*12)),extra=num($('extra').value);const pay=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;let bal=P,months=0,interest=0;while(bal>0&&months<1200){const i=bal*r;const principal=Math.min(bal,pay+extra-i);interest+=i;bal-=principal;months++;if(pay+extra<=i&&r>0)break;}const total=(pay*n);out(`Standard monthly payment\n${money(pay)} for ${n} months\n\nStandard total\nTotal payment: ${money(total)}\nEstimated interest: ${money(total-P)}\n\nWith extra payment\nExtra monthly: ${money(extra)}\nEstimated payoff: ${months} month(s) / ${(months/12).toFixed(1)} year(s)\nEstimated interest with extra: ${money(interest)}\nInterest saved: ${money(Math.max(0,(total-P)-interest))}\n\nFormula\nMonthly payment = P × r(1+r)^n / ((1+r)^n - 1)\n\nNote\nThis is an estimate. Real bank calculations may include fees, insurance, daily interest or different compounding rules.`);}},
'sst-calculator':{title:'SST Calculator',type:'Finance',icon:'🧾',html:`<div class="grid"><label>Amount<input id="amount" type="number" step="any" value="100"></label><label>Tax %<select id="rate"><option value="6">6%</option><option value="8" selected>8%</option><option value="10">10%</option><option value="custom">Custom</option></select></label><label>Custom tax %<input id="customRate" type="number" step="any" value="8"></label><label>Mode<select id="mode"><option value="add">Add tax</option><option value="remove">Remove tax from total</option></select></label></div><button id="run">Calculate</button>`,run(){const a=num($('amount').value),rv=$('rate').value,r=(rv==='custom'?num($('customRate').value):num(rv))/100;if($('mode').value==='add'){const tax=a*r;out(`Tax exclusive calculation\nSubtotal: ${money(a)}\nTax rate: ${(r*100).toFixed(2)}%\nTax amount: ${money(tax)}\nFinal total: ${money(a+tax)}\n\nInvoice wording\nSubtotal ${money(a)} + SST ${money(tax)} = ${money(a+tax)}`);}else{const before=a/(1+r),tax=a-before;out(`Tax inclusive calculation\nTotal paid: ${money(a)}\nTax rate: ${(r*100).toFixed(2)}%\nPrice before tax: ${money(before)}\nTax included: ${money(tax)}\n\nFormula\nBefore tax = total / (1 + tax rate)`);}}},
'password-generator':{title:'Password Generator',type:'Security',icon:'🔐',html:`<div class="grid"><label>Length<input id="len" type="number" min="8" max="128" value="20"></label><label>How many<input id="count" type="number" min="1" max="20" value="5"></label></div><label class="inline-check"><input id="upper" type="checkbox" checked> Uppercase</label><label class="inline-check"><input id="lower" type="checkbox" checked> Lowercase</label><label class="inline-check"><input id="num" type="checkbox" checked> Numbers</label><label class="inline-check"><input id="sym" type="checkbox" checked> Symbols</label><label class="inline-check"><input id="amb" type="checkbox" checked> Avoid ambiguous characters like O, 0, I, l</label><button id="run">Generate</button>`,run(){const sets=[];if($('upper').checked)sets.push('ABCDEFGHJKLMNPQRSTUVWXYZ');if($('lower').checked)sets.push('abcdefghijkmnopqrstuvwxyz');if($('num').checked)sets.push('23456789');if($('sym').checked)sets.push('!@#$%^&*_-+=?');let chars=sets.join('')||'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';if(!$('amb').checked)chars+='O0Il1';const len=Math.min(128,Math.max(8,num($('len').value)||20));const count=Math.min(20,Math.max(1,num($('count').value)||5));const list=[];for(let c=0;c<count;c++){const arr=new Uint32Array(len);crypto.getRandomValues(arr);let s='';for(let i=0;i<len;i++)s+=chars[arr[i]%chars.length];list.push(s);}const bits=Math.log2(chars.length)*len;out(`Generated passwords\n${list.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\nStrength estimate\nCharacter pool: ${chars.length}\nEntropy: ~${bits.toFixed(1)} bits\nRecommended use: ${bits>=80?'Strong for most accounts':'Increase length for stronger security'}\n\nTip\nUse a password manager. Do not reuse the same password across accounts.`);}},
'password-strength-checker':{title:'Password Strength Checker',type:'Security',icon:'🛡️',html:`<label>Password<input id="pw" type="password" placeholder="Type password to check"></label><button id="run">Check</button>`,run(){const p=$('pw').value||'';let pool=0,h=[];if(/[a-z]/.test(p))pool+=26;else h.push('Add lowercase letters.');if(/[A-Z]/.test(p))pool+=26;else h.push('Add uppercase letters.');if(/\d/.test(p))pool+=10;else h.push('Add numbers.');if(/[^A-Za-z0-9]/.test(p))pool+=32;else h.push('Add symbols.');if(p.length<12)h.push('Use at least 12 characters.');if(/(.)\1{2,}/.test(p))h.push('Avoid repeated characters.');if(/password|qwerty|admin|azobss|1234/i.test(p))h.push('Avoid common words or patterns.');const entropy=p.length&&pool?Math.log2(Math.pow(pool,p.length)):0;const label=entropy>=80?'Strong':entropy>=55?'Good':entropy>=35?'Medium':'Weak';out(`Strength: ${label}\nLength: ${p.length} character(s)\nEstimated entropy: ${entropy.toFixed(1)} bits\nCharacter pool: ${pool || 0}\n\nSuggestions\n${h.length?'- '+h.join('\n- '):'- Looks good. Keep it unique and store it safely.'}\n\nPrivacy note\nThis check runs in your browser. The password is not sent to AZOBSS.`);}},
'qr-code-generator':{title:'QR Code Generator',type:'Converter',icon:'▦',html:`<label>Text or URL<textarea id="txt" placeholder="https://www.azobss.com">https://www.azobss.com</textarea></label><div class="grid"><label>Size<select id="size"><option value="200">200 × 200</option><option value="260" selected>260 × 260</option><option value="400">400 × 400</option></select></label><label>Error correction<select id="ecc"><option value="L">Low</option><option value="M" selected>Medium</option><option value="Q">Quartile</option><option value="H">High</option></select></label></div><button id="run">Generate QR</button><div class="preview"><img id="qr" alt="QR preview" style="max-width:260px;width:100%;display:none;border-radius:12px"></div>`,run(){const t=($('txt').value||'').trim();if(!t){out('Enter text or URL first.');return}const size=$('size').value,ecc=$('ecc').value;const url=`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&ecc=${ecc}&data=${encodeURIComponent(t)}`;$('qr').src=url;$('qr').style.display='block';out(`QR generated\nContent length: ${t.length} character(s)\nSize: ${size} × ${size}\nError correction: ${ecc}\n\nDirect image URL\n${url}\n\nTip\nFor print, use at least 260px or higher. Test scan before sharing.`);}},
'word-counter':{title:'Word Counter',type:'Text Tools',icon:'🔢',html:`<label>Text<textarea id="txt" placeholder="Paste your text here"></textarea></label><button id="run">Count</button>`,run(){const t=$('txt').value||'';const words=(t.trim().match(/\S+/g)||[]).length;const chars=t.length;const charsNoSpace=t.replace(/\s/g,'').length;const lines=t?t.split(/\r?\n/).length:0;const paragraphs=t.trim()?t.trim().split(/\n\s*\n/).length:0;const sentences=(t.match(/[.!?]+(?=\s|$)/g)||[]).length;out(`Text statistics\nWords: ${words}\nCharacters: ${chars}\nCharacters without spaces: ${charsNoSpace}\nLines: ${lines}\nParagraphs: ${paragraphs}\nSentences: ${sentences}\n\nTime estimate\nReading time: ~${Math.max(1,Math.ceil(words/200))} minute(s) at 200 wpm\nSpeaking time: ~${Math.max(1,Math.ceil(words/130))} minute(s) at 130 wpm\n\nDensity\nAverage word length: ${words?fmtFlex(charsNoSpace/words,2):0} character(s)`);}},
'json-formatter':{title:'JSON Formatter',type:'Developer',icon:'🧩',html:`<label>JSON<textarea id="txt" placeholder='{"hello":"world"}'></textarea></label><button id="format">Format</button><button id="minify" class="secondary">Minify</button><button id="validate" class="secondary">Validate</button>`,init(){const parse=()=>JSON.parse($('txt').value);$('format').onclick=()=>{try{const obj=parse();out(JSON.stringify(obj,null,2)+`\n\nValid JSON ✔\nType: ${Array.isArray(obj)?'Array':typeof obj}`)}catch(e){out('Invalid JSON ❌\n'+e.message)}};$('minify').onclick=()=>{try{const obj=parse();out(JSON.stringify(obj)+`\n\nValid JSON ✔\nOriginal length: ${$('txt').value.length}\nMinified length: ${JSON.stringify(obj).length}`)}catch(e){out('Invalid JSON ❌\n'+e.message)}};$('validate').onclick=()=>{try{const obj=parse();out(`Valid JSON ✔\nTop-level type: ${Array.isArray(obj)?'Array':typeof obj}\nKeys/items: ${obj&&typeof obj==='object'?Object.keys(obj).length:0}`)}catch(e){out('Invalid JSON ❌\n'+e.message)}};},run(){}},
'url-encoder-decoder':{title:'URL Encoder / Decoder',type:'Developer',icon:'🔗',html:`<label>Text / URL<textarea id="txt">https://www.azobss.com/tools/?q=hello world&ref=mini tools</textarea></label><button id="enc">Encode component</button><button id="dec" class="secondary">Decode</button><button id="parse" class="secondary">Parse URL</button>`,init(){ $('enc').onclick=()=>out(encodeURIComponent($('txt').value));$('dec').onclick=()=>{try{out(decodeURIComponent($('txt').value))}catch(e){out('Decode error: '+e.message)}};$('parse').onclick=()=>{try{const u=new URL($('txt').value);out(`Protocol: ${u.protocol}\nHost: ${u.host}\nPath: ${u.pathname}\nQuery: ${u.search || '-'}\nHash: ${u.hash || '-'}\n\nQuery parameters\n${Array.from(u.searchParams.entries()).map(([k,v])=>`${k} = ${v}`).join('\n') || '-'}`)}catch(e){out('Invalid full URL: '+e.message)}};},run(){}},
'base64-encoder-decoder':{title:'Base64 Encoder / Decoder',type:'Developer',icon:'🧬',html:`<label>Text<textarea id="txt">AZOBSS</textarea></label><button id="enc">Encode</button><button id="dec" class="secondary">Decode</button>`,init(){ $('enc').onclick=()=>{const encoded=btoa(unescape(encodeURIComponent($('txt').value)));out(`${encoded}\n\nInput length: ${$('txt').value.length} character(s)\nOutput length: ${encoded.length} character(s)\nNote: Base64 is encoding, not encryption.`)};$('dec').onclick=()=>{try{const decoded=decodeURIComponent(escape(atob($('txt').value.trim())));out(`${decoded}\n\nDecoded length: ${decoded.length} character(s)`)}catch(e){out('Decode error: '+e.message)}};},run(){}},
'sha256-hash-generator':{title:'SHA-256 Hash Generator',type:'Developer',icon:'🔏',html:`<label>Text<textarea id="txt">AZOBSS</textarea></label><button id="run">Generate Hash</button>`,async run(){const text=$('txt').value;const data=new TextEncoder().encode(text);const buf=await crypto.subtle.digest('SHA-256',data);const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');out(`SHA-256\n${hex}\n\nDetails\nInput characters: ${text.length}\nInput bytes UTF-8: ${data.length}\nHash length: 64 hex characters / 256 bits\n\nNote\nHashing is one-way. It is useful for file/text verification, not password storage by itself.`);}},
'color-converter':{title:'Color Converter',type:'Image / Design',icon:'🎨',html:`<div class="grid"><label>HEX<input id="hex" value="#22c55e"></label><label>Preview<input id="color" type="color" value="#22c55e"></label></div><button id="run">Convert</button><div class="preview" id="preview">Preview</div>`,init(){ $('color').oninput=()=>{$('hex').value=$('color').value;tools['color-converter'].run()};},run(){let h=$('hex').value.trim();if(!h.startsWith('#'))h='#'+h;if(!/^#[0-9a-f]{6}$/i.test(h)){out('Use HEX format like #22c55e');return}const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);const max=Math.max(r,g,b),min=Math.min(r,g,b);let hue=0,sat=0,lum=(max+min)/2/255;if(max!==min){const d=max-min;sat=lum>0.5?d/(510-max-min):d/(max+min);switch(max){case r:hue=(g-b)/d+(g<b?6:0);break;case g:hue=(b-r)/d+2;break;case b:hue=(r-g)/d+4;break;}hue*=60;}$('color').value=h;$('preview').style.background=h;const brightness=r*0.299+g*0.587+b*0.114;$('preview').style.color=brightness>160?'#020617':'#fff';out(`HEX: ${h.toUpperCase()}\nRGB: rgb(${r}, ${g}, ${b})\nHSL: hsl(${Math.round(hue)}, ${Math.round(sat*100)}%, ${Math.round(lum*100)}%)\n\nCSS\ncolor: ${h.toUpperCase()};\nrgb(${r}, ${g}, ${b});\n\nReadable text suggestion\nUse ${brightness>160?'dark text':'white text'} on this background.`);}},
'eloquent-placeholder':{title:'',type:'',icon:'',html:'',run(){}},
'timestamp-converter':{title:'Timestamp Converter',type:'Developer',icon:'🕒',html:`<div class="grid"><label>Unix timestamp<input id="ts" value=""></label><label>Input type<select id="tsType"><option value="s">Seconds</option><option value="ms">Milliseconds</option></select></label><label>Date time<input id="dt" type="datetime-local"></label></div><button id="now">Use Current Time</button><button id="run">Convert</button>`,init(){const d=new Date();$('dt').value=d.toISOString().slice(0,16);$('ts').value=Math.floor(Date.now()/1000);$('now').onclick=()=>{const n=new Date();$('dt').value=n.toISOString().slice(0,16);$('ts').value=Math.floor(Date.now()/1000);$('tsType').value='s';tools['timestamp-converter'].run();};},run(){const raw=num($('ts').value);const d1=new Date(($('tsType').value==='ms'?raw:raw*1000));const d2=safeDate($('dt').value);out(`Timestamp input\nLocal time: ${d1.toString()}\nUTC time: ${d1.toISOString()}\nUnix seconds: ${Math.floor(d1.getTime()/1000)}\nUnix milliseconds: ${d1.getTime()}\n\nDate input\nLocal time: ${d2?d2.toString():'Invalid date'}\nUnix seconds: ${d2?Math.floor(d2.getTime()/1000):'-'}\nUnix milliseconds: ${d2?d2.getTime():'-'}`);}},
'age-calculator':{title:'Age Calculator',type:'Calculator',icon:'🎂',html:`<div class="grid"><label>Birth date<input id="birth" type="date"></label><label>Until date<input id="until" type="date"></label></div><button id="run">Calculate</button>`,init(){const d=new Date();$('until').value=d.toISOString().slice(0,10);},run(){const b=safeDate($('birth').value),u=safeDate($('until').value);if(!b){out('Choose birth date.');return}let years=u.getFullYear()-b.getFullYear();let months=u.getMonth()-b.getMonth();let days=u.getDate()-b.getDate();if(days<0){months--;days+=new Date(u.getFullYear(),u.getMonth(),0).getDate();}if(months<0){years--;months+=12;}const totalDays=Math.floor((u-b)/86400000);let next=new Date(u.getFullYear(),b.getMonth(),b.getDate());if(next<u)next.setFullYear(u.getFullYear()+1);const daysToBirthday=Math.ceil((next-u)/86400000);out(`Age\n${years} year(s), ${months} month(s), ${days} day(s)\n\nTotal age\n${totalDays.toLocaleString('en-MY')} day(s)\n${Math.floor(totalDays/7).toLocaleString('en-MY')} week(s)\n${Math.floor(totalDays/365.2425).toLocaleString('en-MY')} year estimate\n\nNext birthday\n${daysToBirthday} day(s) remaining`);}},
'date-difference-calculator':{title:'Date Difference Calculator',type:'Calculator',icon:'📅',html:`<div class="grid"><label>Start date<input id="a" type="date"></label><label>End date<input id="b" type="date"></label></div><label class="inline-check"><input id="inclusive" type="checkbox"> Include both start and end dates</label><button id="run">Calculate</button>`,run(){const a=safeDate($('a').value),b=safeDate($('b').value);if(!a||!b){out('Choose both dates.');return}let days=Math.round((b-a)/86400000);const signed=days;if($('inclusive').checked)days+=days>=0?1:-1;const abs=Math.abs(days);let work=0;const start=new Date(Math.min(a,b)),end=new Date(Math.max(a,b));for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const day=d.getDay();if(day!==0&&day!==6)work++;}out(`Date difference\nDays: ${abs.toLocaleString('en-MY')}\nWeeks: ${(abs/7).toFixed(2)}\nMonths estimate: ${(abs/30.436875).toFixed(2)}\nYears estimate: ${(abs/365.2425).toFixed(2)}\nBusiness days estimate: ${work.toLocaleString('en-MY')}\nDirection: ${signed>=0?'end date is after start date':'end date is before start date'}\n\nNote\nMonth/year estimates use average calendar length.`);}},
'aspect-ratio-calculator':{title:'Aspect Ratio Calculator',type:'Image / Design',icon:'🖼️',html:`<div class="grid"><label>Original width<input id="ow" type="number" value="1920"></label><label>Original height<input id="oh" type="number" value="1080"></label><label>New width<input id="nw" type="number" value="1280"></label><label>New height<input id="nh" type="number" placeholder="Auto"></label></div><button id="run">Calculate</button>`,run(){const ow=num($('ow').value),oh=num($('oh').value),nw=num($('nw').value),nh=num($('nh').value);if(!ow||!oh){out('Enter original width and height.');return}const ratio=ow/oh;const g=gcd(ow,oh);const outW=nh?Math.round(nh*ratio):nw;const outH=nw?Math.round(nw/ratio):nh;const common=Math.abs(ratio-16/9)<.02?'16:9 widescreen':Math.abs(ratio-4/3)<.02?'4:3 standard':Math.abs(ratio-1)<.02?'1:1 square':Math.abs(ratio-9/16)<.02?'9:16 vertical':'custom ratio';out(`Aspect ratio\nOriginal: ${ow} × ${oh}\nSimplified: ${ow/g}:${oh/g}\nDecimal ratio: ${ratio.toFixed(4)}\nCommon type: ${common}\n\nResized result\nNew size: ${outW || 0} × ${outH || 0}\n\nTip\nLeave either new width or new height empty to calculate the other side automatically.`);}},
'screen-ppi-calculator':{title:'Screen PPI Calculator',type:'Hardware',icon:'🔎',html:`<div class="grid"><label>Width pixels<input id="w" type="number" value="1920"></label><label>Height pixels<input id="h" type="number" value="1080"></label><label>Diagonal inches<input id="d" type="number" step="any" value="24"></label></div><button id="run">Calculate</button>`,run(){const w=num($('w').value),h=num($('h').value),d=num($('d').value);if(!w||!h||!d){out('Enter width, height and diagonal size.');return}const diag=Math.sqrt(w*w+h*h),ppi=diag/d,pitch=25.4/ppi;const level=ppi>=160?'Very sharp':ppi>=110?'Sharp':ppi>=90?'Normal desktop sharpness':'Low density / may look pixelated';out(`Display density\nPPI: ${ppi.toFixed(2)}\nPixel pitch: ${pitch.toFixed(3)} mm\nDiagonal pixels: ${diag.toFixed(0)}\nResolution: ${w} × ${h}\nScreen size: ${d}"\n\nInterpretation\n${level}\n\nTip\nHigher PPI looks sharper, but text may need scaling on Windows.`);}},
'subnet-calculator':{title:'IP Subnet Calculator',type:'Network / Internet',icon:'🌐',html:`<div class="grid"><label>IPv4<input id="ip" value="192.168.1.10"></label><label>CIDR<input id="cidr" type="number" min="1" max="32" value="24"></label></div><button id="run">Calculate</button>`,run(){function ipToInt(ip){return ip.split('.').reduce((a,b)=>(a<<8)+(parseInt(b)||0),0)>>>0}function intToIp(n){return [24,16,8,0].map(s=>(n>>>s)&255).join('.')}const ip=$('ip').value.trim(),cidr=Math.min(32,Math.max(1,num($('cidr').value)));if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)||ip.split('.').some(x=>+x>255)){out('Enter valid IPv4.');return}const mask=(0xffffffff << (32-cidr))>>>0;const n=ipToInt(ip)&mask;const b=n | (~mask>>>0);const hosts=cidr>=31?0:Math.max(0,Math.pow(2,32-cidr)-2);out(`Subnet result\nNetwork: ${intToIp(n)}/${cidr}\nSubnet mask: ${intToIp(mask)}\nBroadcast: ${intToIp(b)}\nFirst usable: ${hosts?intToIp(n+1):'-'}\nLast usable: ${hosts?intToIp(b-1):'-'}\nUsable hosts: ${hosts.toLocaleString('en-MY')}\n\nNote\n/31 and /32 are special cases and usually do not have normal host ranges.`);}},
'robot-text-case-converter':{title:'',type:'',icon:'',html:'',run(){}},
'text-case-converter':{title:'Text Case Converter',type:'Text Tools',icon:'📝',html:`<label>Text<textarea id="txt">AZOBSS mini web tools</textarea></label><button id="upper">UPPER</button><button id="lower" class="secondary">lower</button><button id="titleBtn" class="secondary">Title Case</button><button id="sentence" class="secondary">Sentence case</button><button id="slug" class="secondary">slug-case</button>`,init(){const get=()=>$('txt').value;const title=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());$('upper').onclick=()=>out(get().toUpperCase());$('lower').onclick=()=>out(get().toLowerCase());$('titleBtn').onclick=()=>out(title(get()));$('sentence').onclick=()=>out(get().toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,c=>c.toUpperCase()));$('slug').onclick=()=>out(get().toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''));},run(){}}
};
// Remove internal placeholder entries from accidental access.
Object.keys(tools).forEach(k=>{if(!tools[k].title)delete tools[k];});
const tool=tools[toolId]||tools['unit-converter'];
document.title=tool.title+' - AZOBSS Tools';
$('toolTitle').textContent=tool.title;$('toolType').textContent=tool.type;$('toolIcon').textContent=tool.icon;$('toolBody').innerHTML=tool.html;
const guide=$('smartGuide');
if(guide){
  const typeText=tool.type||'Tool';
  guide.innerHTML=`<div class="smart-guide-card"><b>1. Enter your values</b><span>Use the input boxes, then press the main action button. Common defaults are already filled in where useful.</span></div><div class="smart-guide-card"><b>2. Read the smart result</b><span>The result is grouped into key numbers, formula notes, interpretation and practical tips.</span></div><div class="smart-guide-card"><b>Private ${escHtml(typeText)}</b><span>This quick tool runs in your browser and is designed for fast daily use.</span></div>`;
}
if(tool.init)tool.init();const runBtn=$('run');if(runBtn)runBtn.addEventListener('click',()=>tool.run&&tool.run());
try{if(tool.run)tool.run();}catch(e){out('Unable to auto-run yet. Enter values and press the button.');}
})();
</script>
