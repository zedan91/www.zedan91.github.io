services:
  - type: web
    name: azobss-lucky-draw-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: AZOBSS_DOWNLOAD_HASH_SECRET
        sync: false
      - key: AZOBSS_DOWNLOAD_SESSION_TTL_MS
        value: "900000"
      - key: AZOBSS_PREMIUM_ALLOWED_FILE_HOSTS
        value: files.azobss.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: TZ
        value: Asia/Kuala_Lumpur
      - key: TOYYIB_SECRET_KEY
        sync: false
      - key: TOYYIB_CATEGORY_CODE
        value: wqrblyk7
      - key: FRONTEND_BASE_URL
        value: https://www.azobss.com
      - key: TOYYIB_BASE_URL
        value: https://toyyibpay.com
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_NAME
        value: AZOBSS
      - key: AUTH_VERIFY_CONTINUE_URL
        value: https://www.azobss.com/?azobssVerified=1
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
