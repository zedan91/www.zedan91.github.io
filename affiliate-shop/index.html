    let products = [];
    let activeFilter = 'all';
    let favouriteOnly = false;

    
  const AZ_USD_PER_MYR = 0.21; // Update this rate anytime if needed.
  function azExtractMyrAmount(price){
    const text = String(price || '').replace(/,/g,'').trim();
    if(!text || /^free$/i.test(text)) return null;
    const match = text.match(/(?:RM\s*)?([0-9]+(?:\.[0-9]{1,2})?)/i);
    return match ? Number(match[1]) : null;
  }
  function azUsdText(price){
    const myr = azExtractMyrAmount(price);
    if(!Number.isFinite(myr)) return '';
    return '≈ USD ' + (myr * AZ_USD_PER_MYR).toFixed(2);
  }
  function azUsdBadge(price){
    const text = azUsdText(price);
    return text ? '<span class="az-usd-price">' + esc(text) + '</span>' : '';
  }
  function azUsdLine(price){
    const text = azUsdText(price);
    return text ? '<div class="az-usd-line">' + esc(text) + '</div>' : '';
  }
function esc(value){
      return String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }

    function clean(v){return String(v || '').trim().toLowerCase();}
    function getCurrentUserObject(){
      try{return JSON.parse(sessionStorage.getItem('azobssCurrentUser') || 'null');}catch(e){return null;}
    }
    function isAdmin(){
      const currentUser = getCurrentUserObject();
      return sessionStorage.getItem('azobssLoggedIn') === '1' && (
        clean(currentUser?.usernameKey) === 'zedan91' || clean(currentUser?.email) === 'zedan91@azobss.local'
      );
    }

    function normalizeProduct(item){
      const price = String(item.price || item.badge || '').trim();
      const isFree = /^free$/i.test(price);
      return {
        id: item.id || ('item-' + Date.now() + '-' + Math.random().toString(36).slice(2,8)),
        title: item.title || item.name || 'Untitled Item',
        desc: item.desc || item.description || '',
        badge: item.badge || (isFree ? 'FREE' : (price || 'Affiliate')),
        price: price || item.badge || 'FREE',
        icon: item.icon || (isFree ? 'FREE' : '🛒'),
        category: item.category || 'affiliate-shop',
        meta: item.meta || item.category || 'Affiliate item',
        link: item.link || item.url || '#',
        buttonText: item.buttonText || (isFree ? 'Download Now' : 'Buy Now'),
        source: item.source || 'static'
      };
    }

    function getHiddenProductIds(){
      try{return JSON.parse(localStorage.getItem(LOCAL_ADMIN_HIDDEN_PRODUCTS_KEY) || '[]').map(String);}catch(e){return [];}
    }
    function setHiddenProductIds(ids){
      localStorage.setItem(LOCAL_ADMIN_HIDDEN_PRODUCTS_KEY, JSON.stringify(Array.from(new Set((ids || []).map(String)))));
    }
    function getLocalAdminProductsRaw(){
      try{const data = JSON.parse(localStorage.getItem(LOCAL_ADMIN_PRODUCTS_KEY) || '[]'); return Array.isArray(data) ? data : [];}catch(e){return [];}
    }
    function saveLocalAdminProductsRaw(items){
      localStorage.setItem(LOCAL_ADMIN_PRODUCTS_KEY, JSON.stringify((Array.isArray(items) ? items : []).filter(Boolean)));
    }
    function upsertLocalProduct(product){
      const list = getLocalAdminProductsRaw();
      const id = String(product.id || '');
      const idx = list.findIndex(x => String(x.id || '') === id);
      const cleanProduct = {...product, id, source: product.source || 'local'};
      if(idx >= 0) list[idx] = cleanProduct;
      else list.unshift(cleanProduct);
      saveLocalAdminProductsRaw(list);
    }
    function removeLocalProduct(id){
      const key = String(id || '');
      saveLocalAdminProductsRaw(getLocalAdminProductsRaw().filter(x => String(x.id || '') !== key));
    }

    function getFavouriteIds(){
      try{return JSON.parse(localStorage.getItem('azobss_liked_products') || '[]');}catch(e){return [];}
    }

    function hasSeparateAffiliatePrice(item){
      const price = String(item?.price || '').trim();
      const badge = String(item?.badge || '').trim();
      return Boolean(price && price.toLowerCase() !== badge.toLowerCase());
    }

    function render(){
      const queryText = searchInput.value.trim().toLowerCase();
      const sortCategory = categorySortSelect?.value || 'all';
      const favouriteIds = getFavouriteIds();
      const filtered = products.filter(item => {
        const haystack = [item.title,item.desc,item.badge,item.meta,item.category,item.icon,item.price].join(' ').toLowerCase();
        const categoryOk = activeFilter === 'all' || item.category === activeFilter;
        const sortOk = true;
        const favOk = !favouriteOnly || favouriteIds.includes(item.id) || localStorage.getItem('azobss_like_' + item.id) === '1';
      
        return categoryOk && sortOk && favOk && (!queryText || haystack.includes(queryText));
      });

      const adminMode = isAdmin();
      document.body.classList.toggle('az-aff-admin', adminMode);
      grid.innerHTML = filtered.map(item => `
        <article class="card" data-product-id="${esc(item.id)}" data-product-source="${esc(item.source || 'static')}" data-category="${esc(item.category)}">
          ${adminMode ? `<div class="card-admin-actions" aria-label="Admin product actions"><button class="card-admin-btn edit" type="button" data-aff-edit="${esc(item.id)}" title="Edit">✎</button><button class="card-admin-btn delete" type="button" data-aff-delete="${esc(item.id)}" title="Delete">🗑</button></div>` : ''}
          <div class="top">
            <div class="icon">${esc(item.icon || 'AZ')}</div>
            <span class="badge">${esc(item.badge || item.price || 'Affiliate')}</span>
          </div>
          <h2>${esc(item.title)}</h2>
          <p>${esc(item.desc)}</p>
          <div class="meta">${esc(item.meta || item.category || 'Affiliate item')}</div>
          <div class="card-actions${hasSeparateAffiliatePrice(item) ? '' : ' card-actions-button-only'}">
            ${hasSeparateAffiliatePrice(item) ? `<span class="card-price">${/^free$/i.test(item.price || '') ? 'FREE' : '🛒 ' + esc(item.price || '')}${azUsdBadge(item.price || '')}</span>` : ''}
            <a class="card-open" href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.buttonText || 'Open')}</a>
          </div>
        </article>
      `).join('');
emptyState.style.display = filtered.length ? 'none' : 'block';
    }

    function refreshAdminState(){
      const adminMode = isAdmin();
      adminAddItemButton.hidden = !adminMode;
      if(adminImportJsonButton) adminImportJsonButton.hidden = !adminMode;
      if(adminExportJsonButton) adminExportJsonButton.hidden = !adminMode;
      const wasAdmin = document.body.classList.contains('az-aff-admin');
      document.body.classList.toggle('az-aff-admin', adminMode);
      if(wasAdmin !== adminMode) render();
    }

    function loadLocalAdminProducts(){
      return getLocalAdminProductsRaw().map(item => normalizeProduct({...item, source:item.source || 'local'}));
    }

    async function loadFirestoreProducts(){
      try{
        const snap = await getDocs(query(collection(db, ADMIN_PRODUCTS_COLLECTION), orderBy('createdAt','desc')));
        return snap.docs.map(d => normalizeProduct({...d.data(), id:d.id, source:'firestore'}));
      }catch(err){
        console.warn('Affiliate admin products Firestore load skipped:', err);
        return [];
      }
    }

    async function loadProducts(){
      let staticProducts = [];
      try{
        const res = await fetch('../affiliate-products.json', {cache:'no-store'});
        staticProducts = res.ok ? await res.json() : [];
      }catch(e){ staticProducts = []; }
      const firestoreProducts = await loadFirestoreProducts();
      const hiddenIds = new Set(getHiddenProductIds());
      const merged = [];
      const seen = new Set();
      [...firestoreProducts, ...loadLocalAdminProducts(), ...(Array.isArray(staticProducts) ? staticProducts.map(item => normalizeProduct({...item, source:item.source || 'static'})) : [])]
        .filter(item => item && !hiddenIds.has(String(item.id || '')))
        .forEach(item => {
          const id = String(item.id || '');
          if(!id || seen.has(id)) return;
          seen.add(id);
          merged.push(item);
        });
      products = merged;
      render();
    }

    chips.forEach(chip => chip.addEventListener('click', () => {
      activeFilter = chip.dataset.filter || 'all';
      if(categorySortSelect) categorySortSelect.value = activeFilter;
      chips.forEach(item => item.classList.toggle('is-active', item === chip));
      categoryTiles.forEach(item => item.classList.toggle('is-active', (item.dataset.filter || 'all') === activeFilter));
      favouriteOnly = false;
      myFavouriteButton?.classList.remove('is-active');
      render();
    }));
    myFavouriteButton?.addEventListener('click', () => {
      favouriteOnly = !favouriteOnly;
      myFavouriteButton.classList.toggle('is-active', favouriteOnly);
      render();
    });
    categorySortSelect?.addEventListener('change', () => {
      activeFilter = categorySortSelect.value || 'all';
      categoryTiles.forEach(item => item.classList.toggle('is-active', (item.dataset.filter || 'all') === activeFilter));
      chips.forEach(item => item.classList.toggle('is-active', (item.dataset.filter || 'all') === activeFilter));
      favouriteOnly = false;
      myFavouriteButton?.classList.remove('is-active');
      render();
    });
    searchInput.addEventListener('input', render);
    if(categorySearch){
      categorySearch.addEventListener('input', () => {
        const queryText = categorySearch.value.trim().toLowerCase();

          const name = tile.dataset.name || tile.textContent.toLowerCase();
          tile.style.display = !queryText || name.includes(queryText) ? '' : 'none';
        });
      });
    }
    categoryTiles.forEach(tile => tile.addEventListener('click', () => {
      activeFilter = tile.dataset.filter || 'all';
      if(categorySortSelect) categorySortSelect.value = activeFilter;
      categoryTiles.forEach(item => item.classList.toggle('is-active', item === tile));
      chips.forEach(item => item.classList.toggle('is-active', item.dataset.filter === activeFilter));
      render();
    }));

    const modal = document.getElementById('adminProductModal');
    const form = document.getElementById('adminProductForm');
    const closeModal = () => { modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); };
    const openModal = (item = null) => {
      form.reset();
      document.getElementById('adminProductId').value = item?.id || '';
      document.getElementById('adminProductTitle').textContent = item ? 'Edit Item / Card' : 'Add Item / Card';
      document.getElementById('adminProductName').value = item?.title || '';
      document.getElementById('adminProductDesc').value = item?.desc || '';
      document.getElementById('adminProductCategory').value = item?.category || 'computer';
      document.getElementById('adminProductPrice').value = item?.price || item?.badge || 'FREE';
      document.getElementById('adminProductIcon').value = item?.icon || '🛒';
      document.getElementById('adminProductButtonText').value = item?.buttonText || (/^free$/i.test(item?.price || item?.badge || '') ? 'Download Now' : 'Buy Now');
      document.getElementById('adminProductLink').value = item?.link || '';
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden','false');
    };
    adminAddItemButton?.addEventListener('click', () => openModal());
    document.getElementById('adminProductClose')?.addEventListener('click', closeModal);
    document.getElementById('adminProductCancel')?.addEventListener('click', closeModal);
    // Do not close/cancel the add/edit card when clicking outside the modal box.
    modal?.addEventListener('click', e => { if(e.target === modal) e.preventDefault(); });

    form?.addEventListener('submit', async e => {
      e.preventDefault();
      if(!isAdmin()) return alert('Admin only.');
      const existingId = document.getElementById('adminProductId').value.trim();
      const oldItem = existingId ? products.find(x => String(x.id) === existingId) : null;
      const product = normalizeProduct({
        id: existingId || undefined,
        title: document.getElementById('adminProductName').value.trim(),
        desc: document.getElementById('adminProductDesc').value.trim(),
        category: document.getElementById('adminProductCategory').value,
        price: document.getElementById('adminProductPrice').value.trim() || 'FREE',
        badge: document.getElementById('adminProductPrice').value.trim() || 'FREE',
        icon: document.getElementById('adminProductIcon').value.trim() || '🛒',
        buttonText: document.getElementById('adminProductButtonText').value,
        link: document.getElementById('adminProductLink').value.trim(),
        meta: document.getElementById('adminProductCategory').selectedOptions[0]?.textContent || 'Affiliate item',
        source: oldItem?.source || 'local'
      });
      try{
        if(existingId && oldItem?.source === 'firestore'){
          await updateDoc(doc(db, ADMIN_PRODUCTS_COLLECTION, existingId), {...product, updatedAt: serverTimestamp(), updatedBy: 'zedan91'});
        }else if(!existingId){
          await addDoc(collection(db, ADMIN_PRODUCTS_COLLECTION), {...product, source:'firestore', createdAt: serverTimestamp(), createdBy: 'zedan91'});
        }else{
          upsertLocalProduct({...product, source:'local'});
          if(oldItem?.source === 'static') setHiddenProductIds([...getHiddenProductIds(), existingId]);
        }
      }catch(err){
        upsertLocalProduct({...product, source:'local'});
        if(existingId && oldItem?.source === 'static') setHiddenProductIds([...getHiddenProductIds(), existingId]);
        alert('Firestore sync tidak berjaya. Item disimpan local sementara dalam browser ini.');
      }
      closeModal();
      await loadProducts();
    });

    grid?.addEventListener('click', async e => {
      const editBtn = e.target.closest('[data-aff-edit]');
      const deleteBtn = e.target.closest('[data-aff-delete]');
      if(!editBtn && !deleteBtn) return;
      e.preventDefault();
      e.stopPropagation();
      if(!isAdmin()) return alert('Admin only.');
      const id = String((editBtn || deleteBtn).dataset.affEdit || (editBtn || deleteBtn).dataset.affDelete || '');
      const item = products.find(x => String(x.id) === id);
      if(!item) return;
      if(editBtn){ openModal(item); return; }
      if(!confirm('Delete this affiliate item/card?')) return;
      try{
        if(item.source === 'firestore'){
          await deleteDoc(doc(db, ADMIN_PRODUCTS_COLLECTION, id));
        }else if(item.source === 'local'){
          removeLocalProduct(id);
        }else{
          setHiddenProductIds([...getHiddenProductIds(), id]);
        }
      }catch(err){
        if(item.source === 'firestore') setHiddenProductIds([...getHiddenProductIds(), id]);
        else if(item.source === 'local') removeLocalProduct(id);
        else setHiddenProductIds([...getHiddenProductIds(), id]);
        alert('Firestore delete tidak berjaya. Item disembunyikan local sementara dalam browser ini.');
      }
      await loadProducts();
    });

    adminImportJsonButton?.addEventListener('click', () => {
      if(!isAdmin()) return alert('Admin only.');
      adminImportJsonInput?.click();
    });

    adminImportJsonInput?.addEventListener('change', async () => {
      if(!isAdmin()) return alert('Admin only.');
      const file = adminImportJsonInput.files?.[0];
      if(!file) return;
      try{
        const text = await file.text();
        const parsed = JSON.parse(text);
        const rows = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.products) ? parsed.products : []);
        if(!rows.length) return alert('JSON tiada senarai produk.');
        let firestoreOk = true;
        for(const row of rows){
          const product = normalizeProduct({...row, source:'local'});
          try{
            await addDoc(collection(db, ADMIN_PRODUCTS_COLLECTION), {...product, source:'firestore', createdAt: serverTimestamp(), createdBy: 'zedan91'});
          }catch(err){
            firestoreOk = false;
            upsertLocalProduct(product);
          }
        }
        alert(firestoreOk ? 'Import JSON berjaya sync ke Firestore.' : 'Sebahagian item import disimpan local kerana Firestore sync tidak berjaya.');
        adminImportJsonInput.value = '';
        await loadProducts();
      }catch(err){
        alert('Format JSON tidak sah.');
      }
    });

    adminExportJsonButton?.addEventListener('click', () => {
      if(!isAdmin()) return alert('Admin only.');
      const exportData = products.map(({id,title,desc,badge,price,icon,category,meta,link,buttonText,source}) => ({id,title,desc,badge,price,icon,category,meta,link,buttonText,source}));
      const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'azobss-affiliate-products-export.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    setInterval(refreshAdminState, 1500);
    refreshAdminState();
    loadProducts();
  </script>

  window.azobssAddShopCart=add; window.azobssOpenShopCart=openPanel; window.azobssShopCartItems=read; window.azobssRefreshShopCart=function(){try{render();updateBadges();}catch(e){}};

    if(e.target.closest('[data-az-cart-checkout]')){
const items=read();
if(!items.length)return;
const totalAmount=items.reduce((s,i)=>s+((parseFloat(String(i.price||0).replace(/[^0-9.]/g,''))||0)*Number(i.qty||1)),0);
const totalQty=items.reduce((s,i)=>s+Number(i.qty||1),0);
const firstItem=items[0]||{};
const checkoutItem={
id:'CART-CHECKOUT',

downloadLink:firstItem.downloadLink||firstItem.secureDownloadLink||firstItem.premiumDownloadFileLink||'',

};
if(typeof window.azobssOpenPremiumPay==='function'){window.azobssOpenPremiumPay(checkoutItem); closePanel();}
else if(items[0].pageUrl){location.href=items[0].pageUrl;}
else {alert('Buka page Software Tools atau CAD Tools untuk checkout item ini.');}
return;
}
  });

<script type="module" id="azobss-cart-firestore-sync-js">
/* AZOBSS cart persistence:
   - Guest buyers: localStorage only.
   - Logged-in Firebase users: localStorage + Firestore sync.
*/
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';

(function(){
  if(window.__azobssCartFirestoreSyncReady) return;
  window.__azobssCartFirestoreSyncReady = true;

  let CART_KEY = 'azobss_shop_cart_guest_v1';
  window.__azobssCurrentCartKey = CART_KEY;
  const metaKey = () => CART_KEY + '_meta';
  const COLLECTION = 'userCarts';
  const firebaseConfig = {
    apiKey: 'AIzaSyDuf03esBSpddXAOwuP-uOmHVRp54pZyr8',
    authDomain: 'azobss.firebaseapp.com',
    projectId: 'azobss',
    storageBucket: 'azobss.firebasestorage.app',
    messagingSenderId: '159277716405',
    appId: '1:159277716405:web:17d8924b6b6380e2b77ffc'
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUid = '';
  let syncTimer = null;
  let loadingFromCloud = false;
  let cloudPulling = false;
  let cloudReady = false;

  try{
    // Remove old shared cart key so logged-in cart cannot leak into guest view.
    if(localStorage.getItem('azobss_shop_cart_v1') !== null){
      localStorage.removeItem('azobss_shop_cart_v1');
      localStorage.removeItem('azobss_shop_cart_v1_meta');
    }
  }catch(e){}

  function readCart(){
    try{
      const parsed = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
    }catch(e){ return []; }
  }

  function saveCart(items){
    localStorage.setItem(CART_KEY, JSON.stringify(Array.isArray(items) ? items.filter(Boolean) : []));
    window.dispatchEvent(new Event('azobss-shop-cart-updated'));
  }

  function localUpdatedAt(){
    try{
      const meta = JSON.parse(localStorage.getItem(metaKey()) || '{}');
      return Number(meta.updatedAt || 0);
    }catch(e){ return 0; }
  }

  function markLocalUpdated(){
    if(loadingFromCloud) return;
    try{ localStorage.setItem(metaKey(), JSON.stringify({updatedAt:Date.now()})); }catch(e){}
  }

  function itemKey(i){
    return String(i?.source || '') + '::' + String(i?.id || i?.name || '');
  }

  function mergeCart(a,b){
    const map = new Map();
    [...(Array.isArray(a)?a:[]), ...(Array.isArray(b)?b:[])].filter(Boolean).forEach(item=>{
      const key = itemKey(item);
      if(!key || key === '::') return;
      const old = map.get(key);
      if(!old) map.set(key, {...item, qty:Number(item.qty||1)});
      else{
        const oldQty = Number(old.qty||1);
        const newQty = Number(item.qty||1);
        map.set(key, {...old, ...item, qty:Math.max(oldQty, newQty)});
      }
    });
    return Array.from(map.values());
  }

  async function pushCloud(){
    if(!currentUid || loadingFromCloud || cloudPulling || !cloudReady) return;
    const items = readCart();
    const totalQty = items.reduce((s,i)=>s+Number(i.qty||1),0);
    try{
      await setDoc(doc(db, COLLECTION, currentUid), {
        uid: currentUid,
        items,
        totalQty,
        updatedAtMs: Date.now(),
        updatedAt: serverTimestamp()
      }, {merge:true});
    }catch(err){
      console.warn('AZOBSS cart Firestore sync skipped:', err);
    }
  }

  async function pullCloud(user){
    currentUid = user?.uid || '';
    if(!currentUid) return;
    cloudPulling = true;
    cloudReady = false;
    try{
      const ref = doc(db, COLLECTION, currentUid);
      const snap = await getDoc(ref);
      const localItems = readCart();
      const localTime = localUpdatedAt();
      if(snap.exists()){
        const data = snap.data() || {};
        const now = Date.now();
        const maxAge = 60*24*60*60*1000;
        const cloudItems = (Array.isArray(data.items) ? data.items.filter(Boolean) : [])
          .filter(i => !i.addedAt || (now - Number(i.addedAt)) <= maxAge);
        const cloudTime = Number(data.updatedAtMs || 0);
        loadingFromCloud = true;
        localStorage.setItem(CART_KEY, JSON.stringify(cloudItems));
        localStorage.setItem(metaKey(), JSON.stringify({updatedAt:cloudTime || Date.now()}));
        loadingFromCloud = false;
        cloudReady = true;
        if(Array.isArray(data.items) && data.items.length !== cloudItems.length){
          setTimeout(pushCloud, 300);
        }
        window.dispatchEvent(new Event('azobss-shop-cart-updated'));
      }else if(localItems.length){
        cloudReady = true;
        await pushCloud();
      }else{
        loadingFromCloud = true;
        localStorage.setItem(CART_KEY, JSON.stringify([]));
        localStorage.setItem(metaKey(), JSON.stringify({updatedAt:Date.now()}));
        loadingFromCloud = false;
        cloudReady = true;
        window.dispatchEvent(new Event('azobss-shop-cart-updated'));
      }
      if(typeof window.azobssOpenShopCart === 'function'){
        window.dispatchEvent(new Event('azobss-shop-cart-updated'));
      }
    }catch(err){
      console.warn('AZOBSS cart Firestore load skipped:', err);
    }finally{
      loadingFromCloud = false;
      cloudPulling = false;
    }
  }

  window.azobssCartDebug=function(){
    return {uid: currentUid, key: CART_KEY, items: readCart()};
  };
  window.addEventListener('azobss-shop-cart-updated', ()=>{
    markLocalUpdated();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushCloud, 150);
  });

  onAuthStateChanged(auth, user => {
    if(user){
      CART_KEY = 'azobss_shop_cart_user_' + user.uid + '_v1';
      window.__azobssCurrentCartKey = CART_KEY;
      pullCloud(user);
      window.dispatchEvent(new Event('azobss-shop-cart-updated'));
    }else{
      currentUid = '';
      CART_KEY = 'azobss_shop_cart_guest_v1';
      window.__azobssCurrentCartKey = CART_KEY;
      window.dispatchEvent(new Event('azobss-shop-cart-updated'));
    }
  });
})();
</script>

  function isBellBtn(el){
    return !!(el && el.closest && el.closest('[title="Notifications"],[aria-label="Notifications"]'));
  }

  function isChatBtn(el){
    return !!(el && el.closest && el.closest('[title="Contact Admin / Support"],[title="Contact Admin"],[title="Support"],[aria-label="Contact Admin / Support"]'));
  }

  function isCartBtn(el){
    return !!(el && el.closest && el.closest('[data-az-shop-cart-toggle],[title="My Cart"],[aria-label="My Cart"],.market-icon-btn.cart,.cart-toggle,.shop-cart-toggle'));
  }

  function closeBell(){ var p=bellPanel(); if(p) p.classList.remove('is-open'); }
  function closeChat(){ var p=chatPanel(); if(p) p.classList.remove('is-open'); }
  function closeCart(){
    var p=cartPanel();
    if(p){
      p.classList.remove('is-open');
      p.classList.remove('open');
    }
  }

  function openBell(){
    closeChat(); closeCart();
    var p=bellPanel(); if(p) p.classList.add('is-open');
    if(typeof window.azobssLoadNotifications==='function') window.azobssLoadNotifications();
    if(typeof window.azobssMarkNotificationsSeen==='function') window.azobssMarkNotificationsSeen();
  }

  function openChat(){
    closeBell(); closeCart();
    var p=chatPanel(); if(p) p.classList.add('is-open');
    if(typeof window.azobssLoadSupportMessages==='function') window.azobssLoadSupportMessages();
    if(typeof window.azMarkSupportSeen==='function') window.azMarkSupportSeen();
  }

  function toggleBell(){
    var p=bellPanel();
    var already=!!(p && p.classList.contains('is-open'));
    closeChat(); closeCart();
    if(already) closeBell(); else openBell();
  }

  function toggleChat(){
    var p=chatPanel();
    var already=!!(p && p.classList.contains('is-open'));
    closeBell(); closeCart();
    if(already) closeChat(); else openChat();
  }

  document.addEventListener('click',function(e){
    if(isBellBtn(e.target)){
      e.preventDefault();
      e.stopImmediatePropagation();
      e.stopPropagation();
      toggleBell();
      return;
    }

    if(isChatBtn(e.target)){
      e.preventDefault();
      e.stopImmediatePropagation();
      e.stopPropagation();
      toggleChat();
      return;
    }

    if(isCartBtn(e.target)){
      closeBell();
      closeChat();
      setTimeout(function(){closeBell();closeChat();},80);
      return;
    }
  },true);

  document.addEventListener('click',function(e){
    var bp=bellPanel(), cp=chatPanel();
    var insideBell=bp && bp.contains(e.target);
    var insideChat=cp && cp.contains(e.target);
    var topIcon=isBellBtn(e.target)||isChatBtn(e.target)||isCartBtn(e.target);
    if(!insideBell && !insideChat && !topIcon){
      closeBell();
      closeChat();
    }
  },false);

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      closeBell();
      closeChat();
      closeCart();
    }
  });

  window.azobssCloseTopbarPanels=function(){closeBell();closeChat();closeCart();};
})();
</script>

(function(){
  if(window.__azAffiliateAdminSoftwareCategoryRuntime) return;
  window.__azAffiliateAdminSoftwareCategoryRuntime=true;

  // Scope this helper to Affiliate Shop only.
  // It used to scan every <select> on every page and wrongly injected
  // a "Software" option into Mini Web Tools filters.
  const azPath=(location.pathname||'/').toLowerCase();
  if(!(azPath==='/affiliate-shop/' || azPath==='/affiliate-shop/index.html')) return;

  function isCategorySelect(sel){
    if(!sel || sel.tagName!=='SELECT') return false;
    const text=(sel.textContent||'').toLowerCase();
    const id=((sel.id||'')+' '+(sel.name||'')+' '+(sel.className||'')).toLowerCase();
    return id.includes('category') || text.includes('mobile & accessories') || text.includes('computer & accessories');
  }

  function addSoftwareOption(sel){
    if(!isCategorySelect(sel)) return;
    const has=[...sel.options].some(o=>(o.textContent||'').trim().toLowerCase()==='software' || String(o.value||'').toLowerCase()==='software');
    if(has) return;

    const opt=document.createElement('option');
    opt.value='software';
    opt.textContent='Software';

    const mobile=[...sel.options].find(o=>(o.textContent||'').trim().toLowerCase()==='mobile & accessories');
    if(mobile) sel.insertBefore(opt,mobile);
    else sel.insertBefore(opt,sel.firstChild);
  }

  function run(){
    document.querySelectorAll('select').forEach(addSoftwareOption);
  }

  document.addEventListener('DOMContentLoaded',run);
  if(document.readyState!=='loading') run();
  [300,800,1500,3000].forEach(t=>setTimeout(run,t));
  new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});
})();

<script id="azobss-role-hardening-041-js">
(function(){
  if(window.__azobssRoleHardening041) return;
  window.__azobssRoleHardening041 = true;

  function lower(v){ return String(v || '').trim().toLowerCase(); }

  function readStoredObjects(){
    var out = [];
    var keys = [
      'azobssCurrentUser','azobssUser','azobss_current_user','azobssSavedUser',
      'azobss_user_profile','azobssProfile','currentUser','userProfile',
      'azobss_auth_user','azobssLoginUser','azobss_logged_user'
    ];
    keys.forEach(function(k){
      try{
        var raw = localStorage.getItem(k) || sessionStorage.getItem(k);
        if(!raw) return;
        try{
          var obj = JSON.parse(raw);
          if(obj && typeof obj === 'object') out.push(obj);
        }catch(e){
          out.push({username:raw, raw:raw});
        }
      }catch(e){}
    });
    return out;
  }

  function detectRole(){
    var adminNames = ['zedan91'];
    var adminEmails = ['zedan9107@gmail.com','zedan91@azobss.local'];

    var visibleName = lower((document.querySelector('#signedInName') || {}).textContent);
    var userNameBox = lower((document.querySelector('.user-name') || {}).textContent);

    if(adminNames.indexOf(visibleName) !== -1 || adminNames.indexOf(userNameBox) !== -1 || userNameBox.indexOf('zedan91') !== -1){
      return 'admin';
    }

    var objs = readStoredObjects();
    for(var i=0;i<objs.length;i++){
      var u = objs[i] || {};
      var role = lower(u.role || u.userRole || u.accountRole || u.type || u.accessRole);
      var username = lower(u.usernameKey || u.username || u.userName || u.id || u.name || u.displayName || u.raw);
      var email = lower(u.email || u.authEmail || u.realEmail || u.userEmail);

      if(adminNames.indexOf(username) !== -1 || adminEmails.indexOf(email) !== -1){
        return 'admin';
      }

      if(role === 'admin' || u.isAdmin === true || u.admin === true || u.owner === true){
        return 'admin';
      }

      if(
        role === 'staff' || role === 'semiadmin' || role === 'semi-admin' ||
        role === 'semi_admin' || role === 'seller' || role === 'editor' ||
        u.isStaff === true || u.staff === true || u.staffDashboard === true ||
        u.canAccessStaffDashboard === true || u.canAddSoftware === true
      ){
        return 'staff';
      }
    }

    try{
      if(localStorage.getItem('azobss_admin_role_cache') === '1') return 'admin';
      if(localStorage.getItem('azobss_staff_role_cache') === '1') return 'staff';
    }catch(e){}

    return 'none';
  }

  function setRoleClass(role){
    document.body.classList.toggle('az-role-is-admin', role === 'admin');
    document.body.classList.toggle('is-admin', role === 'admin');
    document.body.classList.toggle('az-role-is-staff', role === 'staff');
    document.body.classList.toggle('az-role-is-stafflike', role === 'staff');
    document.body.setAttribute('data-az-current-role', role);
  }

  function hardHide(el){
    if(!el) return;
    el.style.setProperty('display','none','important');
    el.style.setProperty('visibility','hidden','important');
    el.style.setProperty('pointer-events','none','important');
    el.setAttribute('aria-hidden','true');
    el.tabIndex = -1;
  }

  function hardShow(el){
    if(!el) return;
    el.style.setProperty('display','inline-flex','important');
    el.style.setProperty('visibility','visible','important');
    el.style.setProperty('pointer-events','auto','important');
    el.removeAttribute('aria-hidden');
    el.tabIndex = 0;
  }

  function applyButtons(){
    var role = detectRole();
    setRoleClass(role);

    document.querySelectorAll('.azAdminDashboardBtn,.admin-dashboard-btn,.market-nav a[href="/admin/"],a[href="/admin/"].azobss-nav-chip').forEach(function(el){
      role === 'admin' ? hardShow(el) : hardHide(el);
    });

    document.querySelectorAll('.azStaffDashboardBtn,.staff-dashboard-btn,.market-nav a[href="/staff/"],a[href="/staff/"].azobss-nav-chip').forEach(function(el){
      role === 'staff' ? hardShow(el) : hardHide(el);
    });

    return role;
  }

  function showDenied(required, role){
    if(document.getElementById('azRoleDenyOverlay041')) return;
    var div = document.createElement('div');
    div.id = 'azRoleDenyOverlay041';
    div.innerHTML = '<div class="box"><h2>Access Restricted</h2><p>This page is for '+required+' only.<br>Current role: '+role+'</p><a href="/">Go to Home</a></div>';
    document.body.appendChild(div);
    setTimeout(function(){ location.href = '/'; }, 1800);
  }

  function guardPage(){
    var path = location.pathname.toLowerCase();
    var required = '';
    if(path === '/admin/' || path === '/admin/index.html') required = 'admin';
    if(path === '/staff/' || path === '/staff/index.html') required = 'staff';
    if(!required) return;

    var role = applyButtons();

    if(role === required) return;

    // Allow a short delay for auth UI/localStorage to initialize before blocking.
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      role = applyButtons();
      if(role === required){
        clearInterval(timer);
        return;
      }
      if(tries >= 8){
        clearInterval(timer);
        showDenied(required, role);
      }
    }, 350);
  }

  function run(){
    applyButtons();
    guardPage();
  }

  document.addEventListener('DOMContentLoaded', run);
  if(document.readyState !== 'loading') run();
  window.addEventListener('storage', run);
  window.addEventListener('focus', run);
  setTimeout(run, 300);
  setTimeout(run, 1200);
  setTimeout(run, 2500);
})();
</script>
