<style>
/* Stable CSS chat icon: avoids emoji/encoding corruption */
.nav-whatsapp-circle{position:relative !important;font-size:0 !important;overflow:visible !important;}
.nav-whatsapp-circle::before{content:"" !important;display:block !important;width:18px !important;height:14px !important;border-radius:999px !important;background:#fff !important;line-height:1 !important;}
.nav-whatsapp-circle::after{content:"" !important;position:absolute !important;left:13px !important;top:23px !important;width:7px !important;height:7px !important;background:#fff !important;clip-path:polygon(0 0,100% 0,0 100%) !important;transform:rotate(-12deg) !important;}
.whatsapp{display:inline-flex !important;align-items:center !important;justify-content:center !important;width:58px !important;height:58px !important;padding:0 !important;font-size:0 !important;position:fixed !important;}
.whatsapp::before{content:"" !important;display:block !important;width:25px !important;height:19px !important;border-radius:999px !important;background:#fff !important;}
.whatsapp::after{content:"" !important;position:absolute !important;left:31px !important;top:34px !important;width:10px !important;height:10px !important;background:#fff !important;clip-path:polygon(0 0,100% 0,0 100%) !important;transform:rotate(-12deg) !important;}
</style>

  <script>
    const grid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('emptyState');
    const categorySearch = document.getElementById('categorySearch');
    const categoryTiles = Array.from(document.querySelectorAll('.category-tile'));
    const chips = Array.from(document.querySelectorAll('[data-filter]'));
    let products = [];
    let activeFilter = 'all';

    function esc(value){
      return String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }

    function render(){
      const query = searchInput.value.trim().toLowerCase();
      const filtered = products.filter(item => {
        const haystack = [item.title,item.desc,item.badge,item.meta,item.category,item.icon].join(' ').toLowerCase();
        const categoryOk = activeFilter === 'all' || item.category === activeFilter;
        return categoryOk && (!query || haystack.includes(query));
      });
      grid.innerHTML = filtered.map(item => `
        <a class="card" href="${esc(item.link)}" target="_blank" rel="noopener">
          <div class="top">
            <div class="icon">${esc(item.icon || 'AZ')}</div>
            <span class="badge">${esc(item.badge || 'Affiliate')}</span>
          </div>
          <h2>${esc(item.title)}</h2>
          <p>${esc(item.desc)}</p>
          <div class="meta">${esc(item.meta || item.category || 'Affiliate item')}</div>
        </a>
      `).join('');
      emptyState.style.display = filtered.length ? 'none' : 'block';
    }

    chips.forEach(chip => chip.addEventListener('click', () => {
      activeFilter = chip.dataset.filter || 'all';
      chips.forEach(item => item.classList.toggle('is-active', item === chip));
      render();
    }));
    searchInput.addEventListener('input', render);
    if(categorySearch){
      categorySearch.addEventListener('input', () => {
        const query = categorySearch.value.trim().toLowerCase();
        categoryTiles.forEach(tile => {
          const name = tile.dataset.name || tile.textContent.toLowerCase();
          tile.style.display = !query || name.includes(query) ? '' : 'none';
        });
      });
    }

    fetch('../affiliate-products.json', {cache:'no-store'})
      .then(res => res.ok ? res.json() : [])
      .then(data => {
        products = Array.isArray(data) ? data : [];
        render();
      })
      .catch(() => {
        products = [];
        render();
      });
  </script>

<script type="module">
/* Home-style same-page Firebase auth for secondary pages */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, setPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyDuf03esBSpddXAOwuP-uOmHVRp54pZyr8',authDomain:'azobss.firebaseapp.com',projectId:'azobss',storageBucket:'azobss.firebasestorage.app',messagingSenderId:'159277716405',appId:'1:159277716405:web:17d8924b6b6380e2b77ffc'};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const modal=document.getElementById('siteAuthModal');
const title=document.getElementById('siteAuthTitle');
const signInForm=document.getElementById('siteSignInForm');
const signUpForm=document.getElementById('siteSignUpForm');
const loginError=document.getElementById('siteLoginError');
const signupError=document.getElementById('siteSignupError');
const loginBtn=document.getElementById('siteSignInButton');
const signupBtn=document.getElementById('siteSignUpButton');
const closeBtn=document.getElementById('siteAuthClose');

function normalizeUsername(value){return String(value||'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'');}
function buildUserEmail(usernameKey){return `${usernameKey}@azobss.local`;}
function cleanPhone(value){return String(value||'').replace(/[^0-9]/g,'').replace(/^60/,'').replace(/^0+/,'');}
function buildInviteCode(usernameKey){return `AZ${String(usernameKey||'USER').replace(/[^a-z0-9]/gi,'').toUpperCase().slice(0,6)}`;}
function initials(name){return String(name||'AZ').trim().split(/\s+/).slice(0,2).map(part=>part.charAt(0).toUpperCase()).join('')||'AZ';}
function saveUser(user){sessionStorage.setItem('azobssCurrentUser',JSON.stringify(user));localStorage.setItem('azobssCurrentUser',JSON.stringify(user));}
function syncHeader(user){
  const authActions=document.getElementById('siteAuthActions');
  const tools=document.getElementById('marketUserTools');
  const name=document.getElementById('signedInName');
  const avatar=document.getElementById('userAvatar');
  const paBm=document.getElementById('paBmNavButton');
  const display=user&&(user.usernameKey||user.name||'');
  const usernameKey=String(user?.usernameKey||user?.name||'').trim().toLowerCase();
  const usedMemberCode=String(user?.invitedByCode||user?.memberCode||user?.paMemberCode||'').trim().toUpperCase()==='ZX6186';
  const canShowPaBm=!!(user&&(usernameKey==='zedan91'||user.paAccess===true||usedMemberCode));
  if(paBm){paBm.hidden=!canShowPaBm;paBm.classList.toggle('is-hidden',!canShowPaBm);}
  if(display){
    document.body.classList.add('is-authenticated');
    if(name) name.textContent=display;
    if(avatar) avatar.textContent=initials(display);
    if(authActions) authActions.style.setProperty('display','none','important');
    if(tools) tools.style.setProperty('display','flex','important');
  }
}
function openSiteAuth(mode='signin'){
  const isSignup=mode==='signup';
  title.textContent=isSignup?'Sign up':'Sign in';
  signInForm.hidden=isSignup;
  signUpForm.hidden=!isSignup;
  loginError.textContent='';
  signupError.textContent='';
  modal.classList.add('is-open');
  modal.setAttribute('aria-hidden','false');
  setTimeout(()=>document.getElementById(isSignup?'siteSignupName':'siteLoginName')?.focus(),50);
}
function closeSiteAuth(){modal.classList.remove('is-open');modal.setAttribute('aria-hidden','true');}
window.openSiteAuth=openSiteAuth;
window.openLoginModal=()=>openSiteAuth('signin');
window.openSignupModal=()=>openSiteAuth('signup');

loginBtn?.addEventListener('click',event=>{event.preventDefault();openSiteAuth('signin');});
signupBtn?.addEventListener('click',event=>{event.preventDefault();openSiteAuth('signup');});
closeBtn?.addEventListener('click',closeSiteAuth);
modal?.addEventListener('click',event=>{if(event.target===modal) closeSiteAuth();});
document.getElementById('switchToSiteSignup')?.addEventListener('click',()=>openSiteAuth('signup'));
document.getElementById('switchToSiteSignin')?.addEventListener('click',()=>openSiteAuth('signin'));

signInForm?.addEventListener('submit',async event=>{
  event.preventDefault();
  loginError.textContent='';
  const usernameKey=normalizeUsername(document.getElementById('siteLoginName').value);
  const password=document.getElementById('siteLoginPassword').value;
  if(!usernameKey||!password){loginError.textContent='Please enter username and password.';return;}
  try{
    await setPersistence(auth,browserSessionPersistence);
    const credential=await signInWithEmailAndPassword(auth,buildUserEmail(usernameKey),password);
    const snap=await getDoc(doc(db,'users',usernameKey));
    const data=snap.exists()?snap.data():{};
    const user={...data,uid:credential.user.uid,usernameKey,name:data.name||usernameKey};
    saveUser(user);syncHeader(user);closeSiteAuth();
  }catch(error){loginError.textContent='Login failed. Please check username or password.';}
});

signUpForm?.addEventListener('submit',async event=>{
  event.preventDefault();
  signupError.textContent='';
  const usernameKey=normalizeUsername(document.getElementById('siteSignupName').value);
  const password=document.getElementById('siteSignupPassword').value;
  const phone=cleanPhone(document.getElementById('siteSignupPhone').value);
  const contactEmail=document.getElementById('siteSignupEmail').value.trim();
  const invitedByCode=document.getElementById('siteSignupInviteCode').value.trim().toUpperCase();
  if(!usernameKey||!password||!phone||!contactEmail){signupError.textContent='Please complete all required fields.';return;}
  try{
    await setPersistence(auth,browserSessionPersistence);
    const credential=await createUserWithEmailAndPassword(auth,buildUserEmail(usernameKey),password);
    const user={uid:credential.user.uid,usernameKey,name:usernameKey,phone:'+60'+phone,phoneLocal:phone,countryCode:'+60',contactEmail,invitedByCode,inviteCode:buildInviteCode(usernameKey),createdAtMs:Date.now(),lastLoginMs:Date.now()};
    await setDoc(doc(db,'users',usernameKey),{...user,createdAt:serverTimestamp(),lastLoginAt:serverTimestamp()},{merge:true});
    saveUser(user);syncHeader(user);closeSiteAuth();
  }catch(error){signupError.textContent=error?.code==='auth/email-already-in-use'?'Username already exists.':'Sign up failed. Please try again.';}
});

if(location.hash==='#login') openSiteAuth('signin');
if(location.hash==='#signup') openSiteAuth('signup');
</script>

<script>
/* AZOBSS secondary auth bridge */
(function(){
  function parseUser(raw){try{return raw ? JSON.parse(raw) : null;}catch(e){return null;}}
  function readUser(){return parseUser(sessionStorage.getItem('azobssCurrentUser')) || parseUser(localStorage.getItem('azobssCurrentUser')) || parseUser(sessionStorage.getItem('azobssUser')) || parseUser(localStorage.getItem('azobssUser'));}
  function initials(name){return String(name || 'AZ').trim().split(/\s+/).slice(0,2).map(function(part){return part.charAt(0).toUpperCase();}).join('') || 'AZ';}
  function showUser(){
    var user = readUser();
    var auth = document.getElementById('siteAuthActions');
    var tools = document.getElementById('marketUserTools');
    var name = document.getElementById('signedInName');
    var avatar = document.getElementById('userAvatar');
    var display = user && (user.usernameKey || user.name || (user.email ? String(user.email).split('@')[0] : ''));
    var paBm = document.getElementById('paBmNavButton');
    var usernameKey = user && String(user.usernameKey || user.name || '').trim().toLowerCase();
    var usedMemberCode = user && String(user.invitedByCode || user.memberCode || user.paMemberCode || '').trim().toUpperCase() === 'ZX6186';
    var canShowPaBm = !!(user && (usernameKey === 'zedan91' || user.paAccess === true || usedMemberCode));
    if(paBm){paBm.hidden = !canShowPaBm; paBm.classList.toggle('is-hidden', !canShowPaBm);}
    if(display){
      if(name) name.textContent = display;
      if(avatar) avatar.textContent = initials(display);
      document.body.classList.add('is-authenticated');
      if(auth) auth.style.setProperty('display', 'none', 'important');
      if(tools) tools.style.setProperty('display', 'flex', 'important');
    }else{
      document.body.classList.remove('is-authenticated');
      if(auth) auth.style.setProperty('display', 'flex', 'important');
      if(tools) tools.style.setProperty('display', 'none', 'important');
    }
  }
  var menu = document.getElementById('userMenu');
  if(menu){
    menu.addEventListener('click', function(event){
      if(event.target.closest('.user-dropdown-item')) return;
      var open = !menu.classList.contains('is-open');
      menu.classList.toggle('is-open', open);
      menu.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function(event){
      if(!menu.contains(event.target)){menu.classList.remove('is-open');menu.setAttribute('aria-expanded','false');}
    });
  }
  var logout = document.getElementById('logoutButton');
  if(logout){logout.addEventListener('click', function(){sessionStorage.removeItem('azobssCurrentUser');localStorage.removeItem('azobssCurrentUser');sessionStorage.removeItem('azobssUser');localStorage.removeItem('azobssUser');showUser();});}
  showUser();
  window.addEventListener('storage', showUser);
})();
</script>
