# AutoCAD LISP

AZOBSS menyediakan AutoCAD LISP untuk mempercepat kerja drafting.

Contoh kegunaan:

- Text automation.
- Layer tools.
- Area calculation.
- Drafting helper.
- Custom request mengikut workflow user.

Harga permulaan: RM10.
